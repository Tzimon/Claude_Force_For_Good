  --sheet: #1e2330;
  --ink: #e7e9ee;
  --muted: #a3aab8;
  --rule: #333a4a;
  --stamp: #a9a9ff;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.15; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--step-3); letter-spacing: 0.01em; margin: 0; }

  z-index: 5;

}

.field > label, .field > .label { font-weight: 700; }
.hint { color: var(--muted); font-size: var(--step--1); }
input[type="date"], input[type="text"], input[type="search"], select, textarea {
  font: inherit; color: var(--ink); background: var(--sheet); border: 1.5px solid var(--rule);

textarea { min-height: 7rem; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }

.stamp-wrap { display: flex; justify-content: center; padding-block: 8px; }
.stamp {

.countdown { text-align: center; font-weight: 700; }

.mark { background: var(--yellow-soft); color: var(--yellow-ink); padding: 0 3px; border-radius: 2px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: step; }

/* Glossary */
.search { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 104px); z-index: 2; }

}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }

/* Templates */
.tpl-list { display: grid; gap: 10px; }
@media (min-width: 640px) { .tpl-list { grid-template-columns: 1fr 1fr; } }
.tpl-card {
  text-align: left; font: inherit; color: var(--ink); background: var(--sheet); cursor: pointer;
  border: 1.5px solid var(--rule); border-radius: var(--radius); padding: 14px; display: grid; gap: 4px;
}
.tpl-card[aria-pressed="true"] { border-color: var(--stamp); box-shadow: inset 0 0 0 1px var(--stamp); }
.tpl-card strong { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }
.letter {
  font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px; color: var(--ink);
}

/* Help */
.help-list { display: grid; gap: 0; }
.help-item { padding-block: 16px; border-top: 1px solid var(--rule); display: grid; gap: 4px; }
.help-item h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; }
.phone { font-family: var(--font-mono); font-weight: 600; }

footer { border-top: 1px solid var(--rule); padding-block: 24px 40px; color: var(--muted); font-size: var(--step--1); display: grid; gap: 8px; }

[dir="rtl"] .steps li { direction: rtl; }

@media (prefers-reduced-motion: no-preference) {

  .top, footer, .no-print { display: none !important; }
  body { background: #fff; color: #000; }
  .letter { border: 0; padding: 0; font-size: 11pt; }

<script>
/*
 * Amtsklar – deadline engine (Fristenrechner)
 *
 * Pure functions, no DOM. Works in the browser (window.Amtsklar.deadline)
 * and in Node (module.exports) so it can be unit-tested.
 *
 * Legal basis (German administrative law, as of 2025):
 *  - Bekanntgabe-Fiktion: a letter sent by post or electronically counts as
 *    delivered on the 4th day after it was sent (§ 41 Abs. 2 VwVfG,
 *    § 37 Abs. 2 SGB X, § 122 Abs. 2 AO; 3 days before 1 Jan 2025,
 *    changed by the Postrechtsmodernisierungsgesetz).
 *  - Start of the deadline: the day of delivery is not counted (§ 187 Abs. 1 BGB).
 *  - End of a deadline in weeks/months/years: § 188 Abs. 2 and 3 BGB.
 *  - If the last day is a Saturday, Sunday or public holiday, the deadline ends
 *    on the next working day (§ 193 BGB, § 31 Abs. 3 VwVfG, § 26 Abs. 3 SGB X,
 *    § 108 Abs. 3 AO, § 222 Abs. 2 ZPO, § 57 VwGO, § 64 Abs. 3 SGG).
 *
 * Deliberately conservative: the engine does NOT postpone the fictional
 * delivery day when it falls on a weekend/holiday (courts disagree on this),
 * so the recommended deadline is never later than the legally correct one.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) {
    module.exports = api;
  } else {
    root.Amtsklar = root.Amtsklar || {};
    root.Amtsklar.deadline = api;
  }
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  // ---------------------------------------------------------------------------
  // Date helpers. All dates are plain calendar dates handled in UTC to avoid
  // daylight-saving surprises.
  // ---------------------------------------------------------------------------

  function makeDate(year, month, day) {
    // month: 1-12
    return new Date(Date.UTC(year, month - 1, day));
  }

  function parseISO(str) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str || "").trim());
    if (!m) return null;
    const d = makeDate(+m[1], +m[2], +m[3]);
    // Reject impossible dates like 2025-02-31
    if (d.getUTCMonth() !== +m[2] - 1 || d.getUTCDate() !== +m[3]) return null;
    return d;
  }

  function toISO(date) {
    return date.toISOString().slice(0, 10);
  }

  function addDays(date, days) {
    return new Date(date.getTime() + days * 86400000);
  }

  function daysInMonth(year, monthIndex0) {
    return new Date(Date.UTC(year, monthIndex0 + 1, 0)).getUTCDate();
  }

  /**
   * Add calendar months according to § 188 Abs. 2, 3 BGB:
   * the deadline ends on the day of the target month with the same number;
   * if that day does not exist, on the last day of the target month.
   */
  function addMonths(date, months) {
    const y = date.getUTCFullYear();
    const m = date.getUTCMonth() + months;
    const targetYear = y + Math.floor(m / 12);
    const targetMonth = ((m % 12) + 12) % 12;
    const day = Math.min(date.getUTCDate(), daysInMonth(targetYear, targetMonth));
    return new Date(Date.UTC(targetYear, targetMonth, day));
  }

  function isWeekend(date) {
    const wd = date.getUTCDay();
    return wd === 0 || wd === 6;
  }

  // ---------------------------------------------------------------------------
  // Public holidays (gesetzliche Feiertage) per federal state
  // ---------------------------------------------------------------------------

  const STATES = {
    BW: "Baden-Württemberg",
    BY: "Bayern",
    BE: "Berlin",
    BB: "Brandenburg",
    HB: "Bremen",
    HH: "Hamburg",
    HE: "Hessen",
    MV: "Mecklenburg-Vorpommern",
    NI: "Niedersachsen",
    NW: "Nordrhein-Westfalen",
    RP: "Rheinland-Pfalz",
    SL: "Saarland",
    SN: "Sachsen",
    ST: "Sachsen-Anhalt",
    SH: "Schleswig-Holstein",
    TH: "Thüringen",
  };

  /** Easter Sunday (Gregorian calendar, anonymous Gregorian algorithm). */
  function easterSunday(year) {
    const a = year % 19;
    const b = Math.floor(year / 100);
    const c = year % 100;
    const d = Math.floor(b / 4);
    const e = b % 4;
    const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4);
    const k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31);
    const day = ((h + l - 7 * m + 114) % 31) + 1;
    return makeDate(year, month, day);
  }

  /**
   * Returns a Map of ISO date -> holiday name for the given year and state.
   * Holidays that only apply in parts of a state (Fronleichnam in some
   * communities of Sachsen/Thüringen, Mariä Himmelfahrt in parts of Bayern,
   * Augsburger Friedensfest) are included with "partial: true" so the UI
   * can warn about them; they are treated as holidays (conservative choice
   * would be to NOT treat them as holidays, see isHoliday()).
   */
  function holidays(year, state) {
    const list = [];
    const add = (date, name, opts) => list.push({ date: toISO(date), name, partial: !!(opts && opts.partial) });
    const easter = easterSunday(year);
    const has = (states) => states.includes(state);

    // Nationwide
    add(makeDate(year, 1, 1), "Neujahr");
    add(addDays(easter, -2), "Karfreitag");
    add(addDays(easter, 1), "Ostermontag");
    add(makeDate(year, 5, 1), "Tag der Arbeit");
    add(addDays(easter, 39), "Christi Himmelfahrt");
    add(addDays(easter, 50), "Pfingstmontag");
    add(makeDate(year, 10, 3), "Tag der Deutschen Einheit");
    add(makeDate(year, 12, 25), "1. Weihnachtstag");
    add(makeDate(year, 12, 26), "2. Weihnachtstag");

    // State-specific
    if (has(["BW", "BY", "ST"])) add(makeDate(year, 1, 6), "Heilige Drei Könige");
    if ((state === "BE" && year >= 2019) || (state === "MV" && year >= 2023)) {
      add(makeDate(year, 3, 8), "Internationaler Frauentag");
    }
    if (state === "BE" && (year === 2020 || year === 2025)) {
      add(makeDate(year, 5, 8), "Tag der Befreiung (einmalig)");
    }
    if (state === "BB") {
      add(easter, "Ostersonntag");
      add(addDays(easter, 49), "Pfingstsonntag");
    }
    if (has(["BW", "BY", "HE", "NW", "RP", "SL"])) add(addDays(easter, 60), "Fronleichnam");
    if (has(["SN", "TH"])) add(addDays(easter, 60), "Fronleichnam (nur in einigen Gemeinden)", { partial: true });
    if (state === "SL") add(makeDate(year, 8, 15), "Mariä Himmelfahrt");
    if (state === "BY") {
      add(makeDate(year, 8, 15), "Mariä Himmelfahrt (nur in Gemeinden mit überwiegend katholischer Bevölkerung)", { partial: true });
      add(makeDate(year, 8, 8), "Augsburger Friedensfest (nur Stadt Augsburg)", { partial: true });
    }
    if (state === "TH" && year >= 2019) add(makeDate(year, 9, 20), "Weltkindertag");
    if (has(["BB", "MV", "SN", "ST", "TH"]) || (has(["HB", "HH", "NI", "SH"]) && year >= 2018) || year === 2017) {
      add(makeDate(year, 10, 31), "Reformationstag");
    }
    if (has(["BW", "BY", "NW", "RP", "SL"])) add(makeDate(year, 11, 1), "Allerheiligen");
    if (state === "SN") {
      // Wednesday before 23 November
      let d = makeDate(year, 11, 22);
      while (d.getUTCDay() !== 3) d = addDays(d, -1);
      add(d, "Buß- und Bettag");
    }

    return list.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  }

  /**
   * Is the date a non-working day for deadline purposes?
   * Partial holidays are NOT treated as holidays here (conservative: the
   * deadline is not extended because of a holiday that might not apply).
   */
  function nonWorkingReason(date, state) {
    const wd = date.getUTCDay();
    if (wd === 6) return { type: "saturday", name: "Samstag" };
    if (wd === 0) return { type: "sunday", name: "Sonntag" };
    const iso = toISO(date);
    const h = holidays(date.getUTCFullYear(), state).find((x) => x.date === iso && !x.partial);
    if (h) return { type: "holiday", name: h.name };
    return null;
  }

  function partialHolidayOn(date, state) {
    const iso = toISO(date);
    return holidays(date.getUTCFullYear(), state).find((x) => x.date === iso && x.partial) || null;
  }

  // ---------------------------------------------------------------------------
  // Deadline computation
  // ---------------------------------------------------------------------------

  /** Number of days of the delivery fiction for a letter sent on `sentDate`. */
  function fictionDays(sentDate) {
    return sentDate.getTime() >= makeDate(2025, 1, 1).getTime() ? 4 : 3;
  }

  /**
   * Compute a deadline.
   *
   * @param {object} input
   * @param {string} input.delivery  "post"      – normal letter / e-mail / portal message, `date` = date it was sent
   *                                               (if unknown: the date printed on the letter)
   *                                 "formal"    – formal delivery (Zustellung, e.g. yellow envelope), `date` = date
   *                                               written on the envelope
   *                                 "known"     – the exact day the letter was received/handed over, `date` = that day
   * @param {string} input.date      ISO date (YYYY-MM-DD)
   * @param {string} input.period    "1w" | "2w" | "1m" | "3m" | "1y"
   * @param {string} input.state     two-letter state code (see STATES) of the authority/court
   * @returns {object} result with the deadline and a step-by-step explanation
   */
  function compute(input) {
    const steps = [];
    const warnings = [];
    const start = parseISO(input && input.date);
    if (!start) throw new Error("invalid-date");
    if (!STATES[input.state]) throw new Error("invalid-state");
    const period = input.period;

    // 1. Day of delivery (Bekanntgabe / Zustellung)
    let delivered;
    if (input.delivery === "post") {
      const n = fictionDays(start);
      delivered = addDays(start, n);
      steps.push({ key: "fiction", days: n, from: toISO(start), to: toISO(delivered) });
    } else if (input.delivery === "formal" || input.delivery === "known") {
      delivered = start;
      steps.push({ key: input.delivery === "formal" ? "formal" : "known", to: toISO(delivered) });
    } else {
      throw new Error("invalid-delivery");
    }

    // 2. Raw end of deadline (§ 187 Abs. 1, § 188 BGB)
    let rawEnd;
    if (period === "1w") rawEnd = addDays(delivered, 7);
    else if (period === "2w") rawEnd = addDays(delivered, 14);
    else if (period === "1m") rawEnd = addMonths(delivered, 1);
    else if (period === "3m") rawEnd = addMonths(delivered, 3);
    else if (period === "1y") rawEnd = addMonths(delivered, 12);
    else throw new Error("invalid-period");
    steps.push({ key: "period", period, from: toISO(delivered), to: toISO(rawEnd) });
    if ((period === "1m" || period === "3m" || period === "1y") && rawEnd.getUTCDate() !== delivered.getUTCDate()) {
      steps.push({ key: "monthEnd", to: toISO(rawEnd) });
    }

    // 3. Shift to next working day (§ 193 BGB etc.)
    let end = rawEnd;
    const skipped = [];
    let reason = nonWorkingReason(end, input.state);
    while (reason) {
      skipped.push({ date: toISO(end), reason });
      end = addDays(end, 1);
      reason = nonWorkingReason(end, input.state);
    }
    if (skipped.length) steps.push({ key: "shift", skipped, to: toISO(end) });

    // Warnings
    const partial = partialHolidayOn(rawEnd, input.state);
    if (partial) warnings.push({ key: "partialHoliday", name: partial.name, date: toISO(rawEnd) });
    if (input.delivery === "post") warnings.push({ key: "receivedLater" });

    const today = input.today ? parseISO(input.today) : null;
    let daysLeft = null;
    if (today) daysLeft = Math.round((end.getTime() - today.getTime()) / 86400000);

    return {
      delivered: toISO(delivered),
      rawEnd: toISO(rawEnd),
      deadline: toISO(end),
      weekday: end.getUTCDay(),
      daysLeft,
      steps,
      warnings,
    };
  }

  return {
    STATES,
    compute,
    holidays,
    easterSunday,
    addMonths,
    parseISO,
    toISO,
    isWeekend,
    nonWorkingReason,
    fictionDays,
  };

    { w: "Antrag", alt: "beantragen, Antragstellung", cat: "brief",
      de: { p: "Eine schriftliche Bitte an die Behörde, z. B. um Geld oder eine Erlaubnis.", tip: "Viele Leistungen gibt es erst ab dem Tag des Antrags. Stellen Sie Anträge früh – auch ohne alle Unterlagen." },
      en: { p: "A written request to the authority, e.g. for money or a permit.", tip: "Many benefits only start from the day you apply. Apply early – even without all documents." } },
    { w: "vorläufig", alt: "vorläufiger Bescheid, vorläufige Bewilligung", cat: "brief",
      de: { p: "Die Entscheidung gilt erst einmal, kann sich aber später noch ändern, wenn genaue Zahlen da sind.", tip: "Später kann eine Nachzahlung oder Rückforderung kommen. Heben Sie alle Belege auf." },
      en: { p: "The decision applies for now but can change later when exact figures are known.", tip: "You may later get an extra payment or have to pay something back. Keep all receipts." } },
    { w: "Ermessen", alt: "Ermessensentscheidung, kann, soll", cat: "brief",
      de: { p: "Die Behörde darf zwischen mehreren Möglichkeiten wählen. Sie muss dabei Ihre Situation berücksichtigen.", tip: "Erklären Sie Ihre besondere Lage (Kinder, Krankheit, Schulden). Das kann die Entscheidung ändern." },
      en: { p: "The authority may choose between several options, but must take your situation into account.", tip: "Explain your special situation (children, illness, debts). It can change the decision." } },

    // ---------------------------------------------------------------- Wehren
    { w: "Widerspruch", alt: "widersprechen, Widerspruch einlegen", cat: "recht",
      de: { p: "Sie sagen der Behörde: „Ich bin mit der Entscheidung nicht einverstanden. Prüfen Sie sie noch einmal.“ Kostenlos.", tip: "Meist 1 Monat Zeit. Eine Begründung können Sie nachreichen. Vorlage unter „Vorlagen“." },
      en: { p: "You tell the authority: „I do not agree with the decision. Please review it.“ Free of charge.", tip: "Usually 1 month. You can send the reasons later. See the template under „Letters“." } },
    { w: "Einspruch", alt: "Einspruch einlegen", cat: "recht",
      de: { p: "Wie Widerspruch – heißt so beim Finanzamt, bei Bußgeldern und bei Strafbefehlen.", tip: "Finanzamt: 1 Monat. Bußgeldbescheid und Strafbefehl: nur 2 Wochen!" },
      en: { p: "Like an objection – this is the word used by the tax office, for fines and penalty orders.", tip: "Tax office: 1 month. Fine notice and penalty order: only 2 weeks!" } },
    { w: "Widerspruchsbescheid", alt: "", cat: "recht",
      de: { p: "Die Antwort auf Ihren Widerspruch. Die Behörde hat noch einmal entschieden.", tip: "Sind Sie immer noch nicht einverstanden, können Sie innerhalb von 1 Monat klagen. Vor dem Sozialgericht ist das kostenlos." },
      en: { p: "The answer to your objection. The authority has decided again.", tip: "If you still disagree, you can sue within 1 month. At the social court this is free of charge." } },
    { w: "Klage", alt: "klagen, Sozialgericht, Verwaltungsgericht", cat: "recht",
      de: { p: "Sie bitten ein Gericht, die Entscheidung der Behörde zu prüfen.", tip: "Beim Sozialgericht (Jobcenter, Rente, Krankenkasse) kostet die Klage für Sie nichts. Sie können sie bei der Rechtsantragsstelle des Gerichts aufschreiben lassen." },
      en: { p: "You ask a court to review the authority's decision.", tip: "At the social court (Jobcenter, pension, health insurance) it costs you nothing. The court's legal application office (Rechtsantragsstelle) can write it down for you." } },
    { w: "Überprüfungsantrag", alt: "§ 44 SGB X, Überprüfung", cat: "recht",
      de: { p: "Antrag, einen alten Sozial-Bescheid noch einmal zu prüfen – auch wenn die Widerspruchsfrist vorbei ist.", tip: "Bei Jobcenter und Sozialamt: Fehler bis zu 1 Jahr rückwirkend korrigierbar (im Bürgergeld-Bereich). Vorlage unter „Vorlagen“." },
      en: { p: "Request to review an old social benefits decision – even after the objection deadline has passed.", tip: "Jobcenter and social welfare office: mistakes can be corrected up to 1 year back. See template under „Letters“." } },
    { w: "Wiedereinsetzung in den vorigen Stand", alt: "Wiedereinsetzung, Fristversäumnis", cat: "recht",
      de: { p: "Sie haben eine Frist ohne eigene Schuld verpasst (z. B. Krankenhaus) und bitten darum, so behandelt zu werden, als wären Sie rechtzeitig gewesen.", tip: "Muss meist innerhalb von 2 Wochen nach Wegfall des Hindernisses beantragt werden (beim Finanzamt: 1 Monat). Den Widerspruch gleich mitschicken." },
      en: { p: "You missed a deadline through no fault of your own (e.g. hospital) and ask to be treated as if you had been on time.", tip: "Usually must be requested within 2 weeks after the obstacle ended (tax office: 1 month). Send the objection at the same time." } },
    { w: "Akteneinsicht", alt: "Akte einsehen, § 25 SGB X, § 29 VwVfG", cat: "recht",
      de: { p: "Sie dürfen die Akte lesen, die die Behörde über Sie führt.", tip: "Hilfreich vor einem Widerspruch: Sie sehen, worauf die Behörde ihre Entscheidung stützt." },
      en: { p: "You may read the file the authority keeps about you.", tip: "Helpful before an objection: you see what the authority based its decision on." } },
    { w: "aufschiebende Wirkung", alt: "sofortige Vollziehung, sofort vollziehbar", cat: "recht",
      de: { p: "Solange über Ihren Widerspruch nicht entschieden ist, muss die Entscheidung meist noch nicht umgesetzt werden. Bei „sofortiger Vollziehung“ gilt das nicht.", tip: "Bei Jobcenter-Kürzungen und vielen Ausländerbehörde-Entscheidungen hat der Widerspruch keine aufschiebende Wirkung. Dann schnell Eilantrag beim Gericht prüfen lassen." },
      en: { p: "As long as your objection is pending, the decision usually does not have to be carried out yet. With „sofortige Vollziehung“ (immediate enforcement) this does not apply.", tip: "For Jobcenter cuts and many immigration office decisions, an objection does not stop the decision. Then get an urgent court application (Eilantrag) checked quickly." } },
    { w: "Eilantrag", alt: "einstweiliger Rechtsschutz, einstweilige Anordnung", cat: "recht",
      de: { p: "Ein schneller Antrag beim Gericht, wenn Sie nicht auf das normale Verfahren warten können (z. B. kein Geld für Essen oder Miete).", tip: "Die Rechtsantragsstelle beim Sozialgericht hilft kostenlos beim Aufschreiben." },
      en: { p: "A fast application to the court when you cannot wait for the normal procedure (e.g. no money for food or rent).", tip: "The legal application office at the social court helps you write it for free." } },
    { w: "Beratungshilfe", alt: "Beratungshilfeschein, Prozesskostenhilfe", cat: "recht",
      de: { p: "Wenn Sie wenig Geld haben, zahlt der Staat fast die ganze Rechtsberatung. Sie zahlen höchstens 15 Euro.", tip: "Den Beratungshilfeschein bekommen Sie beim Amtsgericht Ihres Wohnorts. Mitnehmen: Ausweis, Bescheid, Einkommensnachweise." },
      en: { p: "If you have little money, the state pays almost all of your legal advice. You pay at most 15 euros.", tip: "Get the certificate (Beratungshilfeschein) at the local court (Amtsgericht). Bring ID, the decision and proof of income." } },
    { w: "bestandskräftig", alt: "Bestandskraft, rechtskräftig", cat: "recht",
      de: { p: "Die Entscheidung ist endgültig, weil die Frist für Widerspruch oder Klage vorbei ist.", tip: "Bei Sozialleistungen hilft dann oft noch der Überprüfungsantrag." },
      en: { p: "The decision is final because the deadline for objection or lawsuit has passed.", tip: "For social benefits, a request for review (Überprüfungsantrag) often still helps." } },

    // ---------------------------------------------------------------- Geld
    { w: "Rückforderung", alt: "Erstattung, Erstattungsbescheid, zurückfordern", cat: "geld",
      de: { p: "Die Behörde will Geld zurück, das Sie ihrer Meinung nach zu viel bekommen haben.", tip: "Prüfen Sie die Rechnung genau. Widerspruch ist möglich. Sie können auch Ratenzahlung beantragen." },
      en: { p: "The authority wants back money it believes you received too much of.", tip: "Check the calculation carefully. You can object. You can also request to pay in instalments." } },
    { w: "Aufhebungsbescheid", alt: "Aufhebung, aufheben, Rücknahme", cat: "geld",
      de: { p: "Eine frühere Entscheidung wird ganz oder teilweise gestrichen. Oft kommt danach eine Rückforderung.", tip: "Widerspruch prüfen lassen – besonders, wenn Sie alles richtig angegeben hatten." },
      en: { p: "An earlier decision is cancelled fully or in part. Often followed by a demand for repayment.", tip: "Have an objection checked – especially if you had reported everything correctly." } },
    { w: "Säumniszuschlag", alt: "Säumnis, Verzugszinsen", cat: "geld",
      de: { p: "Eine Strafgebühr, weil Sie zu spät gezahlt haben. Beim Finanzamt und vielen Behörden: 1 % pro angefangenem Monat.", tip: "Wenn Sie nicht zahlen können: sofort Stundung oder Ratenzahlung beantragen." },
      en: { p: "A late-payment fee. At the tax office and many authorities: 1 % per started month.", tip: "If you cannot pay: request a deferral or instalments immediately." } },
    { w: "Mahnung", alt: "Mahngebühr, gemahnt", cat: "geld",
      de: { p: "Erinnerung, dass eine Zahlung zu spät ist. Oft mit Gebühr.", tip: "Nicht ignorieren. Nach der Mahnung kann die Vollstreckung kommen." },
      en: { p: "Reminder that a payment is late, often with a fee.", tip: "Do not ignore it. Enforcement can follow." } },
    { w: "Vollstreckung", alt: "Zwangsvollstreckung, Vollstreckungsankündigung, Gerichtsvollzieher", cat: "geld",
      de: { p: "Die Behörde holt sich das Geld mit Zwang, z. B. vom Konto oder Lohn.", tip: "Sofort reagieren: Ratenzahlung anbieten, Schuldnerberatung kontaktieren. Ein P-Konto schützt das Existenzminimum." },
      en: { p: "The authority takes the money by force, e.g. from your bank account or wages.", tip: "React immediately: offer instalments, contact debt counselling. A P-Konto protects the minimum you need to live." } },
    { w: "Pfändung", alt: "pfänden, Kontopfändung, Lohnpfändung", cat: "geld",
      de: { p: "Ein Teil Ihres Geldes wird für Schulden einbehalten.", tip: "Wandeln Sie Ihr Konto in ein Pfändungsschutzkonto (P-Konto) um – das muss die Bank kostenlos tun." },
      en: { p: "Part of your money is withheld to pay debts.", tip: "Turn your account into a protected account (P-Konto) – the bank must do this free of charge." } },
    { w: "P-Konto", alt: "Pfändungsschutzkonto", cat: "geld",
      de: { p: "Ein Bankkonto, bei dem ein Grundbetrag pro Monat nicht gepfändet werden darf.", tip: "Jede Person darf ein P-Konto haben. Für Kinder und Unterhalt gibt es höhere Freibeträge mit Bescheinigung." },
      en: { p: "A bank account where a basic amount each month cannot be seized.", tip: "Everyone may have one P-Konto. Higher protected amounts for children or maintenance with a certificate." } },
    { w: "Ratenzahlung", alt: "Raten, in Raten zahlen", cat: "geld",
      de: { p: "Sie zahlen eine Schuld in kleinen monatlichen Beträgen.", tip: "Beantragen Sie Raten schriftlich und nennen Sie einen Betrag, den Sie wirklich zahlen können. Vorlage unter „Vorlagen“." },
      en: { p: "You pay a debt in small monthly amounts.", tip: "Request instalments in writing and name an amount you can really afford. Template under „Letters“." } },
    { w: "Stundung", alt: "stunden, Zahlungsaufschub", cat: "geld",
      de: { p: "Sie dürfen später zahlen.", tip: "Gut, wenn Sie bald Geld erwarten (z. B. Nachzahlung). Schriftlich beantragen, Grund nennen." },
      en: { p: "You are allowed to pay later.", tip: "Useful if you expect money soon. Apply in writing and give a reason." } },
    { w: "Nachzahlung", alt: "nachzahlen, Guthaben", cat: "geld",
      de: { p: "Sie bekommen Geld nachträglich, weil Ihnen mehr zustand – oder Sie müssen nachzahlen (z. B. Nebenkosten, Steuern).", tip: "Lesen Sie genau, wer an wen zahlt." },
      en: { p: "Money paid afterwards because you were owed more – or you have to pay more (e.g. utilities, taxes).", tip: "Read carefully who pays whom." } },
    { w: "Gebühr", alt: "Gebührenbescheid, Verwaltungsgebühr, Kosten", cat: "geld",
      de: { p: "Geld, das die Behörde für ihre Arbeit verlangt.", tip: "Bei wenig Einkommen kann man oft Ermäßigung oder Befreiung beantragen." },
      en: { p: "Money the authority charges for its work.", tip: "With low income you can often apply for a reduction or exemption." } },
    { w: "Rundfunkbeitrag", alt: "GEZ, Beitragsservice", cat: "geld",
      de: { p: "Monatlicher Beitrag pro Wohnung für das öffentliche Radio und Fernsehen.", tip: "Mit Bürgergeld, Grundsicherung, BAföG ohne Elternwohnung oder Asylbewerberleistungen können Sie sich befreien lassen – Antrag beim Beitragsservice." },
      en: { p: "Monthly fee per household for public radio and TV.", tip: "With Bürgergeld, basic income support, some BAföG or asylum seeker benefits you can be exempted – apply at the Beitragsservice." } },
    { w: "Steuer-ID", alt: "Steueridentifikationsnummer, Identifikationsnummer, IdNr", cat: "geld",
      de: { p: "Ihre persönliche 11-stellige Steuernummer fürs ganze Leben. Kommt nach der Anmeldung per Post.", tip: "Brauchen Sie für Arbeit, Kindergeld und Bank. Nicht zu verwechseln mit der Steuernummer." },
      en: { p: "Your personal 11-digit tax number for life. Sent by post after registering your address.", tip: "Needed for work, child benefit and banks. Not the same as the „Steuernummer“." } },

    // ---------------------------------------------------------------- Jobcenter & Soziales
    { w: "Bürgergeld", alt: "Grundsicherung für Arbeitsuchende, SGB II, Hartz IV, Grundsicherungsgeld", cat: "sozial",
      de: { p: "Geld vom Jobcenter zum Leben für Menschen, die arbeiten können, aber zu wenig Geld haben.", tip: "Das Bürgergeld wird zur neuen „Grundsicherung“ umgebaut; einzelne Regeln ändern sich. Aktuelle Infos bekommen Sie bei einer Beratungsstelle." },
      en: { p: "Money from the Jobcenter to live on for people who can work but do not have enough money.", tip: "Bürgergeld is being turned into a new „Grundsicherung“ and some rules change. Get current information from a counselling service." } },
    { w: "Bedarfsgemeinschaft", alt: "BG, BG-Nummer", cat: "sozial",
      de: { p: "Alle Personen in einem Haushalt, deren Geld zusammen gerechnet wird, z. B. Paar und Kinder.", tip: "Das Einkommen jeder Person in der BG zählt. Ändert sich etwas, sofort melden." },
      en: { p: "All people in a household whose money is counted together, e.g. a couple and their children.", tip: "Every person's income counts. Report changes immediately." } },
    { w: "Kosten der Unterkunft", alt: "KdU, Unterkunftskosten, Miete, angemessen", cat: "sozial",
      de: { p: "Miete und Heizkosten, die das Jobcenter oder Sozialamt übernimmt.", tip: "Nur „angemessene“ Kosten werden dauerhaft gezahlt. Vor einem Umzug immer vorher die Zusicherung beantragen." },
      en: { p: "Rent and heating costs paid by the Jobcenter or social welfare office.", tip: "Only „reasonable“ costs are paid long-term. Always ask for approval before moving." } },
    { w: "Leistungsminderung", alt: "Sanktion, Minderung, Kürzung", cat: "sozial",
      de: { p: "Das Jobcenter kürzt Ihr Geld, weil Sie eine Pflicht nicht erfüllt haben (z. B. Termin verpasst).", tip: "Wichtiger Grund (Krankheit, Kinderbetreuung)? Sofort mitteilen und Nachweis schicken. Widerspruch möglich." },
      en: { p: "The Jobcenter reduces your money because you did not fulfil a duty (e.g. missed an appointment).", tip: "Important reason (illness, childcare)? Report it right away with proof. You can object." } },
    { w: "Meldeversäumnis", alt: "Einladung, Termin, Meldetermin", cat: "sozial",
      de: { p: "Sie sind ohne wichtigen Grund nicht zu einem Termin beim Jobcenter gekommen.", tip: "Krank? Arbeitsunfähigkeitsbescheinigung (gelber Schein) schicken – am besten vor dem Termin anrufen." },
      en: { p: "You did not attend a Jobcenter appointment without an important reason.", tip: "Sick? Send a sick note (Arbeitsunfähigkeitsbescheinigung) – best call before the appointment." } },
    { w: "Kooperationsplan", alt: "Eingliederungsvereinbarung, EGV", cat: "sozial",
      de: { p: "Ein gemeinsamer Plan mit dem Jobcenter: Was tun Sie, was tut das Jobcenter, um Arbeit zu finden?", tip: "Sie dürfen Wünsche und Einwände äußern. Nehmen Sie sich Zeit zum Lesen." },
      en: { p: "A joint plan with the Jobcenter: what you and the Jobcenter will do to find work.", tip: "You may voice wishes and objections. Take time to read it." } },
    { w: "Weiterbewilligungsantrag", alt: "WBA, Weiterbewilligung, Bewilligungszeitraum", cat: "sozial",
      de: { p: "Antrag, damit das Bürgergeld nach Ende des Bewilligungszeitraums weiter gezahlt wird.", tip: "Rechtzeitig vor Ende stellen – sonst kann eine Lücke ohne Geld entstehen." },
      en: { p: "Application to keep receiving Bürgergeld after the current approval period ends.", tip: "Submit it before the period ends – otherwise there may be a gap without money." } },
    { w: "Wohngeld", alt: "Mietzuschuss, Lastenzuschuss", cat: "sozial",
      de: { p: "Zuschuss zur Miete für Menschen mit geringem Einkommen, die kein Bürgergeld bekommen.", tip: "Viele haben Anspruch und wissen es nicht. Der Wohngeldrechner des Bundes hilft." },
      en: { p: "Rent subsidy for people with low income who do not receive Bürgergeld.", tip: "Many people are eligible without knowing it. The federal housing benefit calculator helps." } },
    { w: "Kinderzuschlag", alt: "KiZ", cat: "sozial",
      de: { p: "Zusätzliches Geld von der Familienkasse für Familien mit kleinem Einkommen.", tip: "Wer Kinderzuschlag bekommt, bekommt oft auch Bildungs- und Teilhabeleistungen und keine Kita-Gebühren." },
      en: { p: "Extra money from the family benefits office for families with small incomes.", tip: "Recipients often also get education and participation benefits and pay no daycare fees." } },
    { w: "Kindergeld", alt: "Familienkasse", cat: "sozial",
      de: { p: "Monatliches Geld für jedes Kind, von der Familienkasse.", tip: "Rückwirkend nur für 6 Monate. Darum früh beantragen." },
      en: { p: "Monthly money for each child, from the family benefits office (Familienkasse).", tip: "Paid retroactively for only 6 months, so apply early." } },
    { w: "Bildung und Teilhabe", alt: "BuT, Bildungspaket", cat: "sozial",
      de: { p: "Extra-Leistungen für Kinder: Schulbedarf, Klassenfahrten, Mittagessen, Nachhilfe, Sportverein.", tip: "Gibt es bei Bürgergeld, Wohngeld, Kinderzuschlag und Sozialhilfe. Oft muss man es extra beantragen." },
      en: { p: "Extra benefits for children: school supplies, class trips, lunch, tutoring, sports club.", tip: "Available with Bürgergeld, housing benefit, child supplement and social assistance. Often needs a separate application." } },
    { w: "Mehrbedarf", alt: "Mehrbedarfe, Alleinerziehende, Schwangerschaft", cat: "sozial",
      de: { p: "Zusätzliches Geld für besondere Situationen, z. B. Schwangerschaft, alleinerziehend, Behinderung, besondere Ernährung.", tip: "Wird oft nicht automatisch gezahlt. Fragen Sie nach!" },
      en: { p: "Extra money for special situations, e.g. pregnancy, single parents, disability, special diet.", tip: "Often not paid automatically. Ask for it!" } },

    // ---------------------------------------------------------------- Aufenthalt
    { w: "Ausländerbehörde", alt: "Ausländeramt, Einwanderungsbehörde, Landesamt für Einwanderung", cat: "aufenthalt",
      de: { p: "Die Behörde für Aufenthaltserlaubnisse, Visa-Verlängerungen und Einbürgerung (manchmal getrennt).", tip: "Termine sind oft knapp. Verlängerung früh beantragen – schriftlich, damit Sie einen Nachweis haben." },
      en: { p: "The authority for residence permits, visa extensions and sometimes naturalisation.", tip: "Appointments are scarce. Apply for an extension early – in writing, so you have proof." } },
    { w: "Fiktionsbescheinigung", alt: "Fiktion, § 81 AufenthG", cat: "aufenthalt",
      de: { p: "Ein Papier, das zeigt: Ihr Aufenthalt gilt weiter, solange über Ihren Antrag noch nicht entschieden ist.", tip: "Wichtig: Verlängerung VOR Ablauf des alten Titels beantragen. Dann gilt der alte Aufenthalt weiter." },
      en: { p: "A document showing that your residence remains valid while your application is pending.", tip: "Important: apply for the extension BEFORE your old permit expires. Then your status continues." } },
    { w: "Aufenthaltserlaubnis", alt: "Aufenthaltstitel, eAT, Titel", cat: "aufenthalt",
      de: { p: "Die Erlaubnis, für eine bestimmte Zeit und einen bestimmten Zweck in Deutschland zu leben.", tip: "Ablaufdatum im Kalender notieren und etwa 2–3 Monate vorher die Verlängerung beantragen." },
      en: { p: "Permission to live in Germany for a certain time and purpose.", tip: "Note the expiry date and apply for an extension about 2–3 months before." } },
    { w: "Duldung", alt: "geduldet, Aussetzung der Abschiebung", cat: "aufenthalt",
      de: { p: "Keine Aufenthaltserlaubnis, sondern die Bestätigung, dass die Abschiebung vorübergehend ausgesetzt ist.", tip: "Holen Sie sich unbedingt Beratung, z. B. bei einer Flüchtlingsberatung. Es gibt Wege zu einem Aufenthaltstitel." },
      en: { p: "Not a residence permit, but confirmation that deportation is temporarily suspended.", tip: "Be sure to get advice, e.g. from refugee counselling. There are paths to a residence permit." } },
    { w: "Wohnsitzauflage", alt: "Wohnsitzregelung, § 12a AufenthG", cat: "aufenthalt",
      de: { p: "Sie müssen an einem bestimmten Ort oder in einem bestimmten Bundesland wohnen.", tip: "Bei Arbeit, Ausbildung oder Familie kann sie aufgehoben werden. Antrag stellen." },
      en: { p: "You must live in a specific place or state.", tip: "It can be lifted for work, training or family reasons. Apply for it." } },
    { w: "Anmeldung", alt: "Wohnsitzanmeldung, Meldebescheinigung, Bürgeramt, Wohnungsgeberbestätigung", cat: "aufenthalt",
      de: { p: "Sie melden Ihre Adresse beim Bürgeramt. Pflicht innerhalb von 2 Wochen nach dem Einzug.", tip: "Mitnehmen: Ausweis/Pass und die Wohnungsgeberbestätigung vom Vermieter." },
      en: { p: "You register your address at the citizens' office. Required within 2 weeks after moving in.", tip: "Bring your ID/passport and the landlord's confirmation (Wohnungsgeberbestätigung)." } },
    { w: "Einbürgerung", alt: "Staatsangehörigkeit, deutscher Pass", cat: "aufenthalt",
      de: { p: "Sie werden deutsche Staatsbürgerin oder deutscher Staatsbürger.", tip: "Seit 2024 ist doppelte Staatsangehörigkeit grundsätzlich erlaubt. Voraussetzungen bei der Einbürgerungsbehörde erfragen." },
      en: { p: "You become a German citizen.", tip: "Since 2024, dual citizenship is generally allowed. Ask the naturalisation authority about the requirements." } },
    { w: "Verpflichtungserklärung", alt: "", cat: "aufenthalt",
      de: { p: "Eine Person verspricht, alle Kosten für den Aufenthalt eines Gastes zu zahlen – auch Kosten für Behörden.", tip: "Gilt oft für lange Zeit. Vor der Unterschrift beraten lassen." },
      en: { p: "A person promises to pay all costs of a guest's stay – including costs to authorities.", tip: "Often valid for a long time. Get advice before signing." } },

    // ---------------------------------------------------------------- Alltag
    { w: "Arbeitsunfähigkeitsbescheinigung", alt: "AU, Krankschreibung, gelber Schein", cat: "alltag",
      de: { p: "Bescheinigung vom Arzt, dass Sie krank sind und nicht arbeiten können.", tip: "Arbeitgeber bekommen sie meist elektronisch. Für das Jobcenter brauchen Sie oft trotzdem einen Ausdruck." },
      en: { p: "Doctor's certificate that you are ill and cannot work.", tip: "Employers usually get it electronically. The Jobcenter often still needs a paper copy." } },
    { w: "Schufa", alt: "Schufa-Auskunft, Bonität, Datenkopie", cat: "alltag",
      de: { p: "Eine Firma, die speichert, ob Sie Rechnungen bezahlen. Vermieter und Banken fragen dort nach.", tip: "Eine kostenlose Datenkopie nach Art. 15 DSGVO können Sie jederzeit bei der Schufa bestellen." },
      en: { p: "A company that records whether you pay your bills. Landlords and banks check it.", tip: "You can order a free copy of your data (Art. 15 GDPR) from Schufa at any time." } },
    { w: "Kündigung", alt: "kündigen, Kündigungsfrist", cat: "alltag",

  root.Amtsklar = root.Amtsklar || {};

<script>
/* Amtsklar – glossary view (Amtsdeutsch decoder) */
(function () {
  "use strict";
  const A = (window.Amtsklar = window.Amtsklar || {});
  A.views = A.views || {};
  const { CATS, TERMS } = A.glossary;
  let query = "";
  let cat = "";

  function norm(s) {
    return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss");
  }

  function texts(term, lang) {
    return term[lang] || term.en || term.de;
  }

  function render(el) {
    const { esc, h, t, state } = A.util;
    const lang = state.lang;
    const catLabel = (c) => (CATS[c][lang] || CATS[c].en || CATS[c].de);
    el.replaceChildren(
      h(`
      <section class="view" aria-labelledby="w-title">
        <header style="display:grid;gap:10px">
          <p class="eyebrow">${esc(t("w.eyebrow"))}</p>
          <h2 id="w-title">${esc(t("w.title"))}</h2>
          <p class="lede">${esc(t("w.lede"))}</p>
        </header>
        <div class="field">
          <label for="w-search">${esc(t("w.search"))}</label>
          <input type="search" id="w-search" placeholder="${esc(t("w.placeholder"))}" value="${esc(query)}" autocomplete="off">
        </div>
        <div class="chips" role="group" aria-label="${esc(t("w.filter"))}">
          <button type="button" class="chip" data-cat="" aria-pressed="${cat === ""}">${esc(t("w.all"))}</button>
          ${Object.keys(CATS).map((c) => `<button type="button" class="chip" data-cat="${c}" aria-pressed="${cat === c}">${esc(catLabel(c))}</button>`).join("")}
        </div>
        <p class="small" id="w-count" aria-live="polite"></p>
        <div class="terms" id="w-list"></div>
      </section>`)
    );

    const list = el.querySelector("#w-list");
    const count = el.querySelector("#w-count");
    const draw = () => {
      const q = norm(query.trim());
      const hits = TERMS.filter((x) => {
        if (cat && x.cat !== cat) return false;
        if (!q) return true;
        const tx = texts(x, lang);
        return [x.w, x.alt, tx.p, x.de.p].some((s) => norm(s).includes(q));
      }).sort((a, b) => {
        // exact/prefix matches on the term first, then alphabetical
        const qa = q && norm(a.w).startsWith(q) ? 0 : 1;
        const qb = q && norm(b.w).startsWith(q) ? 0 : 1;
        return qa - qb || a.w.localeCompare(b.w, "de");
      });
      count.textContent = t("w.count", { n: hits.length });
      if (!hits.length) {
        list.replaceChildren(h(`<p class="empty">${esc(t("w.none"))}</p>`));
        return;
      }
      list.replaceChildren(
        h(
          hits
            .map((x) => {
              const tx = texts(x, lang);
              const showDe = lang !== "de" && tx !== x.de;
              return `<article class="term" id="term-${esc(norm(x.w).replace(/[^a-z0-9]+/g, "-"))}">
                <div class="term-head"><span class="term-word" lang="de">${esc(x.w)}</span><span class="term-cat">${esc(catLabel(x.cat))}</span></div>
                <p class="term-plain">${esc(tx.p)}</p>
                ${tx.tip ? `<p class="term-tip">→ ${esc(tx.tip)}</p>` : ""}
                ${showDe ? `<details class="small"><summary>${esc(t("w.inGerman"))}</summary><p lang="de">${esc(x.de.p)} ${esc(x.de.tip || "")}</p></details>` : ""}
                ${x.alt ? `<p class="small" lang="de">${esc(t("w.also"))}: ${esc(x.alt)}</p>` : ""}
              </article>`;
            })
            .join("")
        )
      );
    };

    el.querySelector("#w-search").addEventListener("input", (e) => {
      query = e.target.value;
      draw();
    });
    el.querySelectorAll(".chip").forEach((b) =>
      b.addEventListener("click", () => {
        cat = b.dataset.cat;
        el.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        draw();
      })
    );
    draw();
  }

  A.views.woerter = { render };
})();

</script>
<script>
/*
 * Amtsklar – app shell: routing, language, deadline calculator view.
 * Other views register themselves on Amtsklar.views before this file runs
 * or after (rendering happens on DOMContentLoaded).
 */
(function () {
  "use strict";
  const A = (window.Amtsklar = window.Amtsklar || {});
  A.views = A.views || {};
  const { LANGS, t: tr } = A.i18n;
  const D = A.deadline;

  const ROUTES = ["frist", "woerter", "vorlagen", "hilfe"];
  const state = {
    lang: "de",
    route: "frist",
    shared: {}, // data passed between views, e.g. deadline -> template
  };

  // ---------------------------------------------------------------- helpers
  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem("amtsklar." + key);
      localStorage.setItem("amtsklar." + key, value);
    } catch (e) {
      return null;
    }
    return null;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  function t(key, vars) {
    return tr(state.lang, key, vars);
  }

  function fmtDate(iso) {
    const [y, m, d] = iso.split("-");
    return `${d}.${m}.${y}`;
  }

  function todayISO() {
    const now = new Date();
    const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0, 10);
  }

  function h(html) {
    const tpl = document.createElement("template");
    tpl.innerHTML = html.trim();
    return tpl.content;
  }

  async function copyText(text, button, doneLabel) {
    try {
      await navigator.clipboard.writeText(text);
      if (button) {
        const old = button.textContent;
        button.textContent = doneLabel || "✓";
        setTimeout(() => (button.textContent = old), 1600);
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  A.util = { esc, fmtDate, todayISO, h, copyText, store, t: (k, v) => t(k, v), state };

  // ---------------------------------------------------------------- deadline view
  const fristForm = {
    delivery: "post",
    date: "",
    period: "1m",
    state: "BY",
  };

  function renderFrist(el) {
    const savedState = store("state");
    if (savedState && D.STATES[savedState]) fristForm.state = savedState;
    if (!fristForm.date) {
      // Example: a letter dated ten days ago, so the first view shows a real result
      const d = new Date();
      d.setDate(d.getDate() - 10);
      fristForm.date = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    const stateOptions = Object.entries(D.STATES)
      .map(([code, name]) => `<option value="${code}"${code === fristForm.state ? " selected" : ""}>${esc(name)}</option>`)
      .join("");
    const periodOptions = ["1w", "2w", "1m", "3m", "1y"]
      .map((p) => `<option value="${p}"${p === fristForm.period ? " selected" : ""}>${esc(t("frist.period." + p))}</option>`)
      .join("");
    const how = ["post", "formal", "known"]
      .map(
        (k) => `
        <label class="choice">
          <input type="radio" name="delivery" id="delivery-${k}" value="${k}"${fristForm.delivery === k ? " checked" : ""}>
          <span>${esc(t("frist.how." + k))}</span>
          <span class="hint">${esc(t("frist.how." + k + ".hint"))}</span>
        </label>`
      )
      .join("");

    el.replaceChildren(
      h(`
      <section class="view" aria-labelledby="frist-title">
        <header style="display:grid;gap:10px">
          <p class="eyebrow">${esc(t("frist.eyebrow"))}</p>
          <h2 id="frist-title">${esc(t("frist.title"))}</h2>
          <p class="lede">${esc(t("frist.lede"))}</p>
        </header>
        <form class="sheet" id="frist-form" novalidate>
          <fieldset class="field" style="border:0;padding:0;margin:0">
            <legend class="label" style="font-weight:700;margin-bottom:6px">${esc(t("frist.how"))}</legend>
            <div class="choices">${how}</div>
          </fieldset>
          <div class="row-2">
            <div class="field">
              <label for="frist-date" id="frist-date-label"></label>
              <input type="date" id="frist-date" value="${esc(fristForm.date)}" required>
              <span class="hint" id="frist-date-hint"></span>
            </div>
            <div class="field">
              <label for="frist-period">${esc(t("frist.period"))}</label>
              <select id="frist-period">${periodOptions}</select>
              <span class="hint">${esc(t("frist.period.hint"))}</span>
            </div>
          </div>
          <div class="field">
            <label for="frist-state">${esc(t("frist.state"))}</label>
            <select id="frist-state">${stateOptions}</select>
            <span class="hint">${esc(t("frist.state.hint"))}</span>
          </div>
        </form>
        <section class="sheet result" id="frist-result" aria-live="polite"></section>
        <section class="sheet">
          <h3>${esc(t("frist.tips"))}</h3>
          <ul style="margin:0;padding-inline-start:1.2em;display:grid;gap:8px">
            <li>${esc(t("frist.tip.1"))}</li>
            <li>${esc(t("frist.tip.2"))}</li>
            <li>${esc(t("frist.tip.3"))}</li>
            <li>${esc(t("frist.tip.4"))}</li>
          </ul>
        </section>
      </section>`)
    );

    const form = el.querySelector("#frist-form");
    const update = (animate) => {
      fristForm.delivery = form.querySelector('input[name="delivery"]:checked').value;
      fristForm.date = form.querySelector("#frist-date").value;
      fristForm.period = form.querySelector("#frist-period").value;
      fristForm.state = form.querySelector("#frist-state").value;
      store("state", fristForm.state);
      form.querySelector("#frist-date-label").textContent = t("frist.date." + fristForm.delivery);
      form.querySelector("#frist-date-hint").textContent = t("frist.date." + fristForm.delivery + ".hint");
      renderFristResult(el.querySelector("#frist-result"), animate);
    };
    form.addEventListener("input", () => update(true));
    form.addEventListener("change", () => update(true));
    form.addEventListener("submit", (e) => e.preventDefault());
    update(false);
  }

  function renderFristResult(box, animate) {
    let r;
    try {
      r = D.compute({ ...fristForm, today: todayISO() });
    } catch (e) {
      box.replaceChildren(h(`<p class="callout warn">${esc(t("frist.invalid"))}</p>`));
      return;
    }
    state.shared.deadline = r;

    const stepText = (s) => {
      if (s.key === "fiction") return { text: t("frist.step.fiction", { from: fmtDate(s.from), days: s.days, to: fmtDate(s.to) }), law: t("frist.law.fiction") };
      if (s.key === "formal" || s.key === "known") return { text: t("frist.step." + s.key, { to: fmtDate(s.to) }), law: "" };
      if (s.key === "period")
        return { text: t("frist.step.period", { period: t("period." + s.period), from: fmtDate(s.from), to: fmtDate(s.to) }), law: t("frist.law.period") };
      if (s.key === "monthEnd") return { text: t("frist.step.monthEnd", { to: fmtDate(s.to) }), law: t("frist.law.monthEnd") };
      if (s.key === "shift") {
        const list = s.skipped
          .map((x) => `${fmtDate(x.date)}: ${x.reason.type === "holiday" ? x.reason.name : t("weekday." + D.parseISO(x.date).getUTCDay())}`)
          .join(", ");
        return { text: t("frist.step.shift", { list, to: fmtDate(s.to) }), law: t("frist.law.shift") };
      }
      return { text: "", law: "" };
    };

    let countdown = "";
    let cls = "countdown";
    if (r.daysLeft !== null) {
      if (r.daysLeft < 0) {
        countdown = t("frist.daysLeft.past", { n: -r.daysLeft });
        cls += " past";
      } else if (r.daysLeft === 0) {
        countdown = t("frist.daysLeft.0");
        cls += " urgent";
      } else if (r.daysLeft === 1) {
        countdown = t("frist.daysLeft.1");
        cls += " urgent";
      } else {
        countdown = t("frist.daysLeft", { n: r.daysLeft });
        if (r.daysLeft <= 7) cls += " urgent";
      }
    }

    const warnings = r.warnings
      .map((w) =>
        w.key === "partialHoliday"
          ? `<p class="callout">${esc(t("frist.warn.partial", { date: fmtDate(w.date), name: w.name }))}</p>`
          : `<p class="small">${esc(t("frist.warn.received"))}</p>`
      )
      .join("");

    const deadlineText = `${t("weekday." + r.weekday)}, ${fmtDate(r.deadline)}`;
    box.replaceChildren(
      h(`
      <div class="stamp-wrap">
        <div class="stamp${animate ? " fresh" : ""}" role="img" aria-label="${esc(t("frist.result.label") + " " + deadlineText)}">
          <span class="stamp-label">${esc(t("frist.result.label"))}</span>
          <span class="stamp-date">${esc(fmtDate(r.deadline))}</span>
          <span class="stamp-day">${esc(t("weekday." + r.weekday))}</span>
        </div>
      </div>
      ${countdown ? `<p class="${cls}">${esc(countdown)}</p>` : ""}
      <p>${t("frist.result.end", { date: `<span class="mark">${esc(deadlineText)}</span>` })}</p>
      ${r.daysLeft !== null && r.daysLeft < 0 ? `<p class="callout warn">${esc(t("frist.past.help"))}</p>` : ""}
      <div style="display:grid;gap:4px">
        <h3>${esc(t("frist.steps"))}</h3>
        <ol class="steps">
          ${r.steps
            .map((s) => {
              const x = stepText(s);
              return `<li><div><p>${esc(x.text)}</p>${x.law ? `<p class="law">${esc(x.law)}</p>` : ""}</div></li>`;
            })
            .join("")}
        </ol>
      </div>
      ${warnings}
      <div class="btn-row no-print">
        <a class="btn" href="#vorlagen" id="to-template" style="text-decoration:none">${esc(t("frist.toTemplate"))}</a>
        <button class="btn secondary" type="button" id="copy-result">${esc(t("frist.copy"))}</button>
      </div>
    `)
    );
    box.querySelector("#copy-result").addEventListener("click", (e) => {
      const lines = [
        `${t("frist.result.label")}: ${deadlineText}`,
        ...r.steps.map((s) => "- " + stepText(s).text),
        "",
        "Amtsklar – " + t("disclaimer"),
      ];
      copyText(lines.join("\n"), e.currentTarget, t("frist.copied"));
    });
  }

  A.views.frist = { render: renderFrist };

  // ---------------------------------------------------------------- shell
  function renderShell() {
    const lang = LANGS[state.lang];
    document.documentElement.lang = state.lang;
    document.documentElement.dir = lang.dir;

    document.querySelector("#tagline").textContent = t("tagline");
    document.querySelector("#lang-label").textContent = t("language");
    const select = document.querySelector("#lang");
    select.replaceChildren(
      ...Object.entries(LANGS).map(([code, l]) => {
        const o = document.createElement("option");
        o.value = code;
        o.textContent = l.name;
        o.selected = code === state.lang;
        return o;
      })
    );
    const nav = document.querySelector("#tabs");
    nav.replaceChildren(
      ...ROUTES.filter((r) => A.views[r]).map((r) => {
        const a = document.createElement("a");
        a.className = "tab";
        a.href = "#" + r;
        a.textContent = t("nav." + r);
        if (r === state.route) a.setAttribute("aria-current", "page");
        return a;
      })
    );
    document.querySelector("#disclaimer").textContent = t("disclaimer");
    document.querySelector("#privacy").textContent = t("footer.privacy");
    document.querySelector("#source-label").textContent = t("footer.source");
    document.querySelector("#updated").textContent = t("footer.updated");
  }

  function render() {
    renderShell();
    const view = A.views[state.route] || A.views.frist;
    view.render(document.querySelector("#view"), { t, state });
  }

  function routeFromHash() {
    const name = location.hash.replace(/^#/, "");
    return ROUTES.includes(name) && A.views[name] ? name : "frist";
  }

  function init() {
    const saved = store("lang");
    const browser = (navigator.language || "de").slice(0, 2);
    state.lang = LANGS[saved] ? saved : LANGS[browser] ? browser : "de";
    state.route = routeFromHash();
    document.querySelector("#lang").addEventListener("change", (e) => {
      state.lang = e.target.value;
      store("lang", state.lang);
      render();
    });
    window.addEventListener("hashchange", () => {
      state.route = routeFromHash();
      render();
      window.scrollTo(0, 0);
    });
    render();
  }

  A.rerender = render;
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
