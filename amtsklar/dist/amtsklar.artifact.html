<style>
/* Layout: one narrow column like a letter page; a sticky "envelope window" header with the tabs.
   Palette: recycled office paper, ink blue-black, rubber-stamp violet, delivery-envelope yellow. */
:root {
  --paper: #eef0ec;
  --sheet: #fbfcfa;
  --ink: #1d2433;
  --muted: #5b6474;
  --rule: #d3d8d2;
  --stamp: #3a3a9e;
  --yellow: #f7c800;
  --yellow-soft: #fff1a8;
  --yellow-ink: #3d3200;
  --danger: #b3261e;
  --ok: #1f6f43;
  --focus: #3a3a9e;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --step--1: 0.875rem;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.2rem;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161a22;
    --sheet: #1e2330;
    --ink: #e7e9ee;
    --muted: #a3aab8;
    --rule: #333a4a;
    --stamp: #a9a9ff;
    --yellow: #f7c800;
    --yellow-soft: #3d3609;
    --yellow-ink: #fff1a8;
    --danger: #ff8a80;
    --ok: #7fd6a3;
    --focus: #a9a9ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #161a22;
  --sheet: #1e2330;
  --ink: #e7e9ee;
  --muted: #a3aab8;
  --rule: #333a4a;
  --stamp: #a9a9ff;
  --yellow: #f7c800;
  --yellow-soft: #3d3609;
  --yellow-ink: #fff1a8;
  --danger: #ff8a80;
  --ok: #7fd6a3;
  --focus: #a9a9ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.55;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--sheet);
}
a { color: var(--stamp); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.15; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--step-3); letter-spacing: 0.01em; margin: 0; }
h3 { font-size: var(--step-1); margin: 0; }
p { margin: 0; }
.wrap {
  max-width: 46rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--sheet);
  border-bottom: 1px solid var(--rule);
}
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; letter-spacing: 0.02em; text-transform: uppercase; }
.brand-name span { background: var(--yellow); color: #1d2433; padding: 0 4px; }
.brand-tag { color: var(--muted); font-size: var(--step--1); }
.lang { display: flex; align-items: center; gap: 6px; font-size: var(--step--1); color: var(--muted); }
.lang select {
  font: inherit; color: var(--ink); background: var(--sheet);
  border: 1px solid var(--rule); border-radius: var(--radius); padding: 6px 8px;
}
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--muted); text-decoration: none; padding: 8px 12px 10px; border-bottom: 3px solid transparent; white-space: nowrap;
}
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--yellow); }
.tab:hover { color: var(--ink); }

main { padding-block: 28px 64px; }
#lang-note { margin: 0 0 24px; }
.view { display: grid; gap: 24px; }
.lede { color: var(--muted); max-width: 62ch; }
.eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.95rem; color: var(--muted); font-weight: 600; }

/* Sheet = a sheet of paper */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px; display: grid; gap: 18px; }
@media (min-width: 640px) { .sheet { padding: 28px; } }

/* Forms */
.field { display: grid; gap: 6px; }
.field > label, .field > .label { font-weight: 700; }
.hint { color: var(--muted); font-size: var(--step--1); }
input[type="date"], input[type="text"], input[type="search"], select, textarea {
  font: inherit; color: var(--ink); background: var(--sheet); border: 1.5px solid var(--rule);
  border-radius: var(--radius); padding: 10px 12px; width: 100%; min-width: 0;
}
textarea { min-height: 7rem; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.choices { display: grid; gap: 8px; }
.choice {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start;
  border: 1.5px solid var(--rule); border-radius: var(--radius); padding: 12px; cursor: pointer;
}
.choice:has(input:checked) { border-color: var(--stamp); background: color-mix(in srgb, var(--stamp) 7%, var(--sheet)); }
.choice input { margin-top: 5px; accent-color: var(--stamp); width: 18px; height: 18px; }
.choice .hint { grid-column: 2; }
.row-2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .row-2 { grid-template-columns: 1fr 1fr; } }
.btn {
  font: inherit; font-weight: 700; cursor: pointer; border-radius: var(--radius); padding: 10px 16px;
  border: 1.5px solid var(--ink); background: var(--ink); color: var(--sheet);
}
.btn.secondary { background: transparent; color: var(--ink); }
.btn:hover { filter: brightness(1.1); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* Result: rubber date stamp */
.result { display: grid; gap: 18px; }
.stamp-wrap { display: flex; justify-content: center; padding-block: 8px; }
.stamp {
  display: inline-grid; justify-items: center; gap: 2px;
  border: 4px double var(--stamp); color: var(--stamp); border-radius: 10px;
  padding: 10px 22px 12px; transform: rotate(-3deg);
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em;
  mix-blend-mode: normal;
}
.stamp-label { font-size: 1rem; font-weight: 600; }
.stamp-date { font-family: var(--font-mono); font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 600; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.stamp-day { font-size: 1.05rem; font-weight: 600; }
.countdown { text-align: center; font-weight: 700; }
.countdown.urgent { color: var(--danger); }
.countdown.past { color: var(--danger); }
.mark { background: var(--yellow-soft); color: var(--yellow-ink); padding: 0 3px; border-radius: 2px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 2rem 1fr; gap: 10px; padding-block: 10px; border-top: 1px dashed var(--rule); counter-increment: step; }
.steps li::before {
  content: counter(step); font-family: var(--font-mono); font-weight: 600; color: var(--stamp);
  border: 1.5px solid var(--stamp); border-radius: 50%; width: 1.7rem; height: 1.7rem; display: grid; place-items: center; font-size: 0.85rem;
}
.law { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.callout { border-left: 4px solid var(--yellow); background: var(--yellow-soft); color: var(--yellow-ink); padding: 12px 14px; border-radius: 0 var(--radius) var(--radius) 0; }
.callout strong { display: block; }
.callout.warn { border-left-color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--sheet)); color: var(--ink); }
.small { font-size: var(--step--1); color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Glossary */
.search { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 104px); z-index: 2; }
.terms { display: grid; gap: 0; }
.term { padding-block: 16px; border-top: 1px solid var(--rule); display: grid; gap: 6px; }
.term-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
.term-word { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; }
.term-cat { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border: 1px solid var(--rule); border-radius: 99px; padding: 1px 8px; }
.term-plain { font-weight: 700; }
.term-tip { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: var(--step--1); cursor: pointer; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
  border-radius: 99px; padding: 4px 12px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.empty { color: var(--muted); padding-block: 24px; }

/* Templates */
.tpl-list { display: grid; gap: 10px; }
@media (min-width: 640px) { .tpl-list { grid-template-columns: 1fr 1fr; } }
.tpl-card {
  text-align: left; font: inherit; color: var(--ink); background: var(--sheet); cursor: pointer;
  border: 1.5px solid var(--rule); border-radius: var(--radius); padding: 14px; display: grid; gap: 4px;
}
.tpl-card[aria-pressed="true"] { border-color: var(--stamp); box-shadow: inset 0 0 0 1px var(--stamp); }
.tpl-card strong { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }
.letter {
  font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px; color: var(--ink);
}

/* Help */
.help-list { display: grid; gap: 0; }
.help-item { padding-block: 16px; border-top: 1px solid var(--rule); display: grid; gap: 4px; }
.help-item h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; }
.phone { font-family: var(--font-mono); font-weight: 600; }

footer { border-top: 1px solid var(--rule); padding-block: 24px 40px; color: var(--muted); font-size: var(--step--1); display: grid; gap: 8px; }

[dir="rtl"] .steps li { direction: rtl; }
[dir="rtl"] .callout { border-left: 0; border-right: 4px solid var(--yellow); border-radius: var(--radius) 0 0 var(--radius); }

@media (prefers-reduced-motion: no-preference) {
  .stamp.fresh { animation: stampin 380ms cubic-bezier(.2,.9,.3,1.3); }
  @keyframes stampin { from { transform: rotate(-3deg) scale(1.35); opacity: 0.2; } to { transform: rotate(-3deg) scale(1); opacity: 1; } }
}
@media print {
  .top, footer, .no-print { display: none !important; }
  body { background: #fff; color: #000; }
  .letter { border: 0; padding: 0; font-size: 11pt; }
}

/* Annotated letter (Brief verstehen) */
.anatomy { display: grid; gap: 20px; }
@media (min-width: 900px) { .anatomy { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; } }
.anatomy-letter { display: grid; gap: 8px; min-width: 0; }
.bescheid {
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 2px; padding: 22px 20px 26px;
  font-family: "Arial", "Helvetica", sans-serif; font-size: 0.9rem; line-height: 1.5; display: grid; gap: 12px;
  box-shadow: 0 1px 0 var(--rule), 0 8px 24px -16px rgba(0,0,0,.35);
}
.b-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.b-right { text-align: end; }
.b-addr { color: var(--muted); }
.b-small { font-size: 0.8rem; color: var(--muted); }
.b-part { position: relative; border-radius: 4px; padding: 4px 6px 4px 34px; margin: 0 -6px; transition: background-color .15s; }
[dir="rtl"] .b-part { padding: 4px 34px 4px 6px; }
.b-part.active { background: var(--yellow-soft); color: var(--yellow-ink); }
.anno {
  position: absolute; inset-inline-start: 4px; top: 4px; width: 22px; height: 22px; border-radius: 50%;
  border: 1.5px solid var(--stamp); background: var(--sheet); color: var(--stamp); font: 600 0.75rem/1 var(--font-mono);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.anno.static { position: static; flex: none; cursor: default; }
.anatomy-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; min-width: 0; }
.anatomy-list li { display: flex; gap: 12px; padding: 12px 8px; border-top: 1px solid var(--rule); cursor: pointer; border-radius: 4px; }
.anatomy-list li.active { background: var(--yellow-soft); color: var(--yellow-ink); }
.anatomy-list li.active .anno { background: var(--stamp); color: var(--sheet); }
.anatomy-list p { color: inherit; }

/* Guides */
.guides { display: grid; gap: 10px; }
.guide { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); }
.guide[open] { border-color: var(--stamp); }
.guide summary { cursor: pointer; padding: 14px 16px; padding-inline-end: 44px; display: grid; gap: 2px; list-style: none; position: relative; }
.guide summary::-webkit-details-marker { display: none; }
.guide summary::before { content: "+"; position: absolute; inset-inline-end: 16px; top: 16px; font: 600 1.3rem/1 var(--font-mono); color: var(--stamp); }
.guide[open] summary::before { content: "–"; }
.guide-title { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; }
.guide-body { padding: 4px 16px 18px; display: grid; gap: 16px; }
.guide-body ul, .guide-body ol { margin: 6px 0 0; padding-inline-start: 1.3em; display: grid; gap: 6px; }

</style>

<script>
/*
 * Amtsklar – deadline engine (Fristenrechner)
 *
 * Pure functions, no DOM. Works in the browser (window.Amtsklar.deadline)
 * and in Node (module.exports) so it can be unit-tested.
 *
 * Legal basis (German administrative law, as of 2025):
 *  - Bekanntgabe-Fiktion: a letter sent by post or electronically counts as
 *    delivered on the 4th day after it was sent (§ 41 Abs. 2 VwVfG,
 *    § 37 Abs. 2 SGB X, § 122 Abs. 2 AO; 3 days before 1 Jan 2025,
 *    changed by the Postrechtsmodernisierungsgesetz).
 *  - Start of the deadline: the day of delivery is not counted (§ 187 Abs. 1 BGB).
 *  - End of a deadline in weeks/months/years: § 188 Abs. 2 and 3 BGB.
 *  - If the last day is a Saturday, Sunday or public holiday, the deadline ends
 *    on the next working day (§ 193 BGB, § 31 Abs. 3 VwVfG, § 26 Abs. 3 SGB X,
 *    § 108 Abs. 3 AO, § 222 Abs. 2 ZPO, § 57 VwGO, § 64 Abs. 3 SGG).
 *
 * Deliberately conservative: the engine does NOT postpone the fictional
 * delivery day when it falls on a weekend/holiday (courts disagree on this),
 * so the recommended deadline is never later than the legally correct one.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) {
    module.exports = api;
  } else {
    root.Amtsklar = root.Amtsklar || {};
    root.Amtsklar.deadline = api;
  }
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  // ---------------------------------------------------------------------------
  // Date helpers. All dates are plain calendar dates handled in UTC to avoid
  // daylight-saving surprises.
  // ---------------------------------------------------------------------------

  function makeDate(year, month, day) {
    // month: 1-12
    return new Date(Date.UTC(year, month - 1, day));
  }

  function parseISO(str) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str || "").trim());
    if (!m) return null;
    const d = makeDate(+m[1], +m[2], +m[3]);
    // Reject impossible dates like 2025-02-31
    if (d.getUTCMonth() !== +m[2] - 1 || d.getUTCDate() !== +m[3]) return null;
    return d;
  }

  function toISO(date) {
    return date.toISOString().slice(0, 10);
  }

  function addDays(date, days) {
    return new Date(date.getTime() + days * 86400000);
  }

  function daysInMonth(year, monthIndex0) {
    return new Date(Date.UTC(year, monthIndex0 + 1, 0)).getUTCDate();
  }

  /**
   * Add calendar months according to § 188 Abs. 2, 3 BGB:
   * the deadline ends on the day of the target month with the same number;
   * if that day does not exist, on the last day of the target month.
   */
  function addMonths(date, months) {
    const y = date.getUTCFullYear();
    const m = date.getUTCMonth() + months;
    const targetYear = y + Math.floor(m / 12);
    const targetMonth = ((m % 12) + 12) % 12;
    const day = Math.min(date.getUTCDate(), daysInMonth(targetYear, targetMonth));
    return new Date(Date.UTC(targetYear, targetMonth, day));
  }

  function isWeekend(date) {
    const wd = date.getUTCDay();
    return wd === 0 || wd === 6;
  }

  // ---------------------------------------------------------------------------
  // Public holidays (gesetzliche Feiertage) per federal state
  // ---------------------------------------------------------------------------

  const STATES = {
    BW: "Baden-Württemberg",
    BY: "Bayern",
    BE: "Berlin",
    BB: "Brandenburg",
    HB: "Bremen",
    HH: "Hamburg",
    HE: "Hessen",
    MV: "Mecklenburg-Vorpommern",
    NI: "Niedersachsen",
    NW: "Nordrhein-Westfalen",
    RP: "Rheinland-Pfalz",
    SL: "Saarland",
    SN: "Sachsen",
    ST: "Sachsen-Anhalt",
    SH: "Schleswig-Holstein",
    TH: "Thüringen",
  };

  /** Easter Sunday (Gregorian calendar, anonymous Gregorian algorithm). */
  function easterSunday(year) {
    const a = year % 19;
    const b = Math.floor(year / 100);
    const c = year % 100;
    const d = Math.floor(b / 4);
    const e = b % 4;
    const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4);
    const k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31);
    const day = ((h + l - 7 * m + 114) % 31) + 1;
    return makeDate(year, month, day);
  }

  /**
   * Returns a Map of ISO date -> holiday name for the given year and state.
   * Holidays that only apply in parts of a state (Fronleichnam in some
   * communities of Sachsen/Thüringen, Mariä Himmelfahrt in parts of Bayern,
   * Augsburger Friedensfest) are included with "partial: true" so the UI
   * can warn about them; they are treated as holidays (conservative choice
   * would be to NOT treat them as holidays, see isHoliday()).
   */
  function holidays(year, state) {
    const list = [];
    const add = (date, name, opts) => list.push({ date: toISO(date), name, partial: !!(opts && opts.partial) });
    const easter = easterSunday(year);
    const has = (states) => states.includes(state);

    // Nationwide
    add(makeDate(year, 1, 1), "Neujahr");
    add(addDays(easter, -2), "Karfreitag");
    add(addDays(easter, 1), "Ostermontag");
    add(makeDate(year, 5, 1), "Tag der Arbeit");
    add(addDays(easter, 39), "Christi Himmelfahrt");
    add(addDays(easter, 50), "Pfingstmontag");
    add(makeDate(year, 10, 3), "Tag der Deutschen Einheit");
    add(makeDate(year, 12, 25), "1. Weihnachtstag");
    add(makeDate(year, 12, 26), "2. Weihnachtstag");

    // State-specific
    if (has(["BW", "BY", "ST"])) add(makeDate(year, 1, 6), "Heilige Drei Könige");
    if ((state === "BE" && year >= 2019) || (state === "MV" && year >= 2023)) {
      add(makeDate(year, 3, 8), "Internationaler Frauentag");
    }
    if (state === "BE" && (year === 2020 || year === 2025)) {
      add(makeDate(year, 5, 8), "Tag der Befreiung (einmalig)");
    }
    if (state === "BB") {

<script>
/* Amtsklar – "How to read a Bescheid": annotated sample letter (fictional names) */
(function () {
  "use strict";
  const A = (window.Amtsklar = window.Amtsklar || {});
  A.views = A.views || {};

  // Parts of the sample letter. n = marker number shown in the letter.
  const PARTS = [
    { n: 1, de: { t: "Absender", p: "Welche Behörde hat geschrieben? Dorthin schicken Sie auch Ihre Antwort." },
             en: { t: "Sender", p: "Which authority wrote to you? This is also where you send your reply." } },
    { n: 2, de: { t: "Datum des Bescheids", p: "Wichtig für die Frist. Bei normaler Post gilt der Brief 4 Tage später als zugestellt. Geben Sie dieses Datum im Fristenrechner ein." },
             en: { t: "Date of the decision", p: "Important for the deadline. With normal post the letter counts as delivered 4 days later. Enter this date in the deadline calculator." } },
    { n: 3, de: { t: "Aktenzeichen / Nummer", p: "Ihre Fallnummer. Schreiben Sie sie auf jeden Brief an die Behörde." },
             en: { t: "Reference number", p: "Your case number. Write it on every letter to the authority." } },
    { n: 4, de: { t: "Betreff: Was für ein Brief?", p: "„Aufhebung“ heißt: Eine frühere Bewilligung wird zurückgenommen. „Erstattung“ heißt: Sie sollen Geld zurückzahlen." },
             en: { t: "Subject: what kind of letter?", p: "„Aufhebung“ means an earlier approval is cancelled. „Erstattung“ means you are asked to pay money back." } },
    { n: 5, de: { t: "Die Entscheidung", p: "Das ist der Kern: Was hat die Behörde entschieden? Für welchen Zeitraum? Lesen Sie diesen Teil zuerst." },
             en: { t: "The decision", p: "This is the core: what did the authority decide, and for which period? Read this part first." } },
    { n: 6, de: { t: "Betrag und Zahlungsfrist", p: "Wie viel, bis wann, auf welches Konto. Wenn Sie widersprechen, müssen Sie oft trotzdem zahlen – Sie können aber Ratenzahlung oder Stundung beantragen." },
             en: { t: "Amount and payment deadline", p: "How much, by when, to which account. Even if you object you often still have to pay – but you can ask for instalments or a deferral." } },
    { n: 7, de: { t: "Begründung", p: "Warum hat die Behörde so entschieden? Prüfen Sie die Zahlen und Daten. Stimmt alles? Fehler hier sind ein guter Grund für einen Widerspruch." },
             en: { t: "Reasons", p: "Why did the authority decide this? Check the figures and dates. Is everything correct? Mistakes here are a good reason to object." } },
    { n: 8, de: { t: "Rechtsbehelfsbelehrung", p: "Hier steht, wie Sie sich wehren: Widerspruch, Frist (meist 1 Monat), Adresse. Fehlt dieser Teil, haben Sie meist 1 Jahr Zeit." },
             en: { t: "Information on legal remedies", p: "This tells you how to challenge the decision: objection, deadline (usually 1 month), address. If this part is missing, you usually have 1 year." } },
    { n: 9, de: { t: "Keine Unterschrift?", p: "Normal. Maschinell erstellte Bescheide gelten auch ohne Unterschrift." },
             en: { t: "No signature?", p: "Normal. Computer-generated decisions are valid without a signature." } },
  ];

  const m = (n) => `<button type="button" class="anno" data-n="${n}" aria-label="${n}">${n}</button>`;

  // Fictional sample letter (German, as people receive it)
  const LETTER = `
<div class="bescheid" lang="de">
  <div class="b-head">
    <div class="b-part" data-n="1">${m(1)}<strong>Jobcenter Musterstadt</strong><br>Agenturstraße 5 · 12345 Musterstadt</div>
    <div class="b-part b-right" data-n="2">${m(2)}Datum: <span class="mono">20.10.2026</span></div>
  </div>
  <p class="b-addr">Frau<br>Maria Muster<br>Musterstraße 1<br>12345 Musterstadt</p>
  <p class="b-part" data-n="3">${m(3)}BG-Nummer: <span class="mono">12345BG0006789</span></p>
  <p class="b-part b-subject" data-n="4">${m(4)}<strong>Aufhebungs- und Erstattungsbescheid</strong></p>
  <p>Sehr geehrte Frau Muster,</p>
  <p class="b-part" data-n="5">${m(5)}die Entscheidung vom 15.05.2026 über die Bewilligung von Leistungen zur Sicherung des Lebensunterhalts wird für die Zeit vom 01.08.2026 bis 31.08.2026 teilweise in Höhe von 312,40 EUR aufgehoben.</p>
  <p class="b-part" data-n="6">${m(6)}Die überzahlte Leistung in Höhe von <strong>312,40 EUR</strong> ist nach § 50 SGB X zu erstatten. Bitte überweisen Sie den Betrag bis zum 20.11.2026 an die Bundesagentur für Arbeit – Regionaldirektion …</p>
  <p class="b-part" data-n="7">${m(7)}<strong>Begründung:</strong> Sie haben im August 2026 Einkommen aus einer Beschäftigung erzielt. Das Einkommen ist nach § 11 SGB II zu berücksichtigen …</p>
  <p class="b-part" data-n="8">${m(8)}<strong>Rechtsbehelfsbelehrung:</strong> Gegen diesen Bescheid kann innerhalb eines Monats nach Bekanntgabe Widerspruch erhoben werden. Der Widerspruch ist schriftlich, in elektronischer Form oder zur Niederschrift beim Jobcenter Musterstadt, Agenturstraße 5, 12345 Musterstadt einzulegen.</p>
  <p class="b-part b-small" data-n="9">${m(9)}Dieses Schreiben wurde maschinell erstellt und ist ohne Unterschrift gültig.</p>
</div>`;

  function render(el) {
    const { esc, h, t, state } = A.util;
    const lang = state.lang;
    const X = A.extraI18n && A.extraI18n[lang];
    const tx = (p) => p[lang] || (X && X.brief[p.n - 1] && { t: X.brief[p.n - 1][0], p: X.brief[p.n - 1][1] }) || p.en || p.de;
    el.replaceChildren(
      h(`
      <section class="view" aria-labelledby="b-title">
        <header style="display:grid;gap:10px">
          <p class="eyebrow">${esc(t("b.eyebrow"))}</p>
          <h2 id="b-title">${esc(t("b.title"))}</h2>
          <p class="lede">${esc(t("b.lede"))}</p>
        </header>
        <div class="anatomy">
          <div class="anatomy-letter">${LETTER}<p class="small">${esc(t("b.sample"))}</p></div>
          <ol class="anatomy-list" id="b-list">
            ${PARTS.map((p) => `<li data-n="${p.n}" tabindex="-1"><span class="anno static" aria-hidden="true">${p.n}</span><div><strong>${esc(tx(p).t)}</strong><p>${esc(tx(p).p)}</p></div></li>`).join("")}
          </ol>
        </div>
        <section class="sheet">
          <h3>${esc(t("b.order"))}</h3>
          <ol style="margin:0;padding-inline-start:1.3em;display:grid;gap:6px">
            <li>${esc(t("b.order.1"))}</li><li>${esc(t("b.order.2"))}</li><li>${esc(t("b.order.3"))}</li><li>${esc(t("b.order.4"))}</li>
          </ol>
          <div class="btn-row"><a class="btn" href="#frist" style="text-decoration:none">${esc(t("b.toFrist"))}</a></div>
        </section>
      </section>`)
    );
    const select = (n) => {
      el.querySelectorAll("[data-n]").forEach((x) => x.classList.toggle("active", x.dataset.n === String(n)));
      const item = el.querySelector(`#b-list li[data-n="${n}"]`);
      if (item && window.matchMedia("(max-width: 899px)").matches) item.scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
    el.querySelectorAll(".anno:not(.static)").forEach((b) => b.addEventListener("click", () => select(b.dataset.n)));
    el.querySelectorAll("#b-list li").forEach((li) => li.addEventListener("click", () => select(li.dataset.n)));
  }

  A.views.brief = { render };
})();

</script>

          ${t("r.lang") ? `<p class="small">${esc(t("r.lang"))}</p>` : ""}
        </header>
        <div class="guides">
          ${GUIDES.map((g) => {
            const x = tx(g);
            return `<details class="guide" id="guide-${g.id}"${open === g.id ? " open" : ""}>
              <summary><span class="guide-title">${esc(x.t)}</span><span class="small">${esc(x.s)}</span></summary>
              <div class="guide-body">
                <div><h3>${esc(t("r.check"))}</h3><ul>${x.check.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>
                <div><h3>${esc(t("r.steps"))}</h3><ol>${x.steps.map((c) => `<li>${esc(c)}</li>`).join("")}</ol></div>
                ${x.warn ? `<p class="callout">${esc(x.warn)}</p>` : ""}
                <div class="btn-row">
                  ${g.period ? `<button type="button" class="btn" data-action="frist" data-period="${g.period}">${esc(t("r.toFrist"))}</button>` : ""}
                  ${g.template ? `<button type="button" class="btn secondary" data-action="vorlage" data-template="${g.template}">${esc(t("r.toTemplate"))}</button>` : ""}
                </div>
                ${g.terms && g.terms.length ? `<div class="chips"><span class="small">${esc(t("r.terms"))}:</span>${g.terms.map((w) => `<button type="button" class="chip" data-action="wort" data-term="${esc(w)}" lang="de">${esc(w)}</button>`).join("")}</div>` : ""}
              </div>
            </details>`;
          }).join("")}
        </div>
        <p class="small">${esc(t("r.missing"))}</p>
      </section>`)
    );
    el.querySelectorAll("details.guide").forEach((d) =>
      d.addEventListener("toggle", () => {
        if (d.open) open = d.id.replace(/^guide-/, "");
      })
    );
    el.querySelector("section.view").addEventListener("click", (e) => {
      const b = e.target.closest("[data-action]");
      if (!b) return;
      if (b.dataset.action === "frist") {
        state.shared.period = b.dataset.period;
        location.hash = "#frist";
      } else if (b.dataset.action === "vorlage") {
        state.shared.template = b.dataset.template;
        location.hash = "#vorlagen";
      } else if (b.dataset.action === "wort") {
        state.shared.query = b.dataset.term;
        location.hash = "#woerter";
      }
    });
  }
  A.views.ratgeber = { render };
})();

</script>

<script>
/* Amtsklar – glossary view (Amtsdeutsch decoder) */
(function () {
  "use strict";
  const A = (window.Amtsklar = window.Amtsklar || {});
  A.views = A.views || {};
  const { CATS, TERMS } = A.glossary;
  let query = "";
  let cat = "";

  function norm(s) {
    return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss");
  }

  function texts(term, lang) {
    if (term[lang]) return term[lang];
    const extra = A.glossaryI18n && A.glossaryI18n[lang] && A.glossaryI18n[lang][term.w];
    // Translated meaning; the practical tip falls back to English and is marked as such
    const tip = A.glossaryTips && A.glossaryTips[lang] && A.glossaryTips[lang][term.w];
    if (extra) return tip ? { p: extra, tip } : { p: extra, tip: term.en.tip, tipLang: "en" };
    return term.en || term.de;
  }

  function render(el) {
    const { esc, h, t, state } = A.util;
    const lang = state.lang;
    if (state.shared.query) {
      query = state.shared.query;
      cat = "";
      state.shared.query = null;
    }
    const catLabel = (c) => (CATS[c][lang] || CATS[c].en || CATS[c].de);
    el.replaceChildren(
      h(`
      <section class="view" aria-labelledby="w-title">
        <header style="display:grid;gap:10px">
          <p class="eyebrow">${esc(t("w.eyebrow"))}</p>
          <h2 id="w-title">${esc(t("w.title"))}</h2>
          <p class="lede">${esc(t("w.lede"))}</p>
        </header>
        <div class="field">
          <label for="w-search">${esc(t("w.search"))}</label>
          <input type="search" id="w-search" placeholder="${esc(t("w.placeholder"))}" value="${esc(query)}" autocomplete="off">
        </div>
        <div class="chips" role="group" aria-label="${esc(t("w.filter"))}">
          <button type="button" class="chip" data-cat="" aria-pressed="${cat === ""}">${esc(t("w.all"))}</button>
          ${Object.keys(CATS).map((c) => `<button type="button" class="chip" data-cat="${c}" aria-pressed="${cat === c}">${esc(catLabel(c))}</button>`).join("")}
        </div>
        <p class="small" id="w-count" aria-live="polite"></p>
        <div class="terms" id="w-list"></div>
      </section>`)
    );

    const list = el.querySelector("#w-list");
    const count = el.querySelector("#w-count");
    const draw = () => {
      const q = norm(query.trim());
      const hits = TERMS.filter((x) => {
        if (cat && x.cat !== cat) return false;
        if (!q) return true;
        const tx = texts(x, lang);
        return [x.w, x.alt, tx.p, x.de.p, x.en.p].some((s) => norm(s).includes(q));
      }).sort((a, b) => {
        // exact/prefix matches on the term first, then alphabetical
        const qa = q && norm(a.w).startsWith(q) ? 0 : 1;
        const qb = q && norm(b.w).startsWith(q) ? 0 : 1;
        return qa - qb || a.w.localeCompare(b.w, "de");
      });
      count.textContent = t("w.count", { n: hits.length });
      if (!hits.length) {
        list.replaceChildren(h(`<p class="empty">${esc(t("w.none"))}</p>`));
        return;
      }
      list.replaceChildren(
        h(
          hits
            .map((x) => {
              const tx = texts(x, lang);
              const showDe = lang !== "de";
              return `<article class="term" id="term-${esc(norm(x.w).replace(/[^a-z0-9]+/g, "-"))}">
                <div class="term-head"><span class="term-word" lang="de">${esc(x.w)}</span><span class="term-cat">${esc(catLabel(x.cat))}</span></div>
                <p class="term-plain">${esc(tx.p)}</p>
                ${tx.tip ? `<p class="term-tip"${tx.tipLang ? ` lang="${tx.tipLang}" dir="ltr"` : ""}>→ ${esc(tx.tip)}</p>` : ""}
                ${showDe ? `<details class="small"><summary>${esc(t("w.inGerman"))}</summary><p lang="de">${esc(x.de.p)} ${esc(x.de.tip || "")}</p></details>` : ""}
                ${x.alt ? `<p class="small" lang="de">${esc(t("w.also"))}: ${esc(x.alt)}</p>` : ""}
              </article>`;
            })
            .join("")
        )
      );
    };

    el.querySelector("#w-search").addEventListener("input", (e) => {
      query = e.target.value;
      draw();
    });
    el.querySelectorAll(".chip").forEach((b) =>
      b.addEventListener("click", () => {
        cat = b.dataset.cat;
        el.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        draw();
      })
    );
    draw();
  }

  A.views.woerter = { render };
})();

</script>

<script>
/* Amtsklar – letter templates view */
(function () {
  "use strict";
  const A = (window.Amtsklar = window.Amtsklar || {});
  A.views = A.views || {};
  const { COMMON, TEMPLATES, buildLetter } = A.templates;

  let current = "widerspruch";
  const values = {};
  let loaded = false;

  function load() {
    if (loaded) return;
    loaded = true;
    const raw = A.util.store("letter");
    if (raw) {
      try {
        Object.assign(values, JSON.parse(raw));
      } catch (e) {
        /* ignore */
      }
    }
  }

  function save() {
    // Only personal fields that repeat across letters are remembered on this device.
    const keep = {};
    for (const f of COMMON) if (values[f.id]) keep[f.id] = values[f.id];
    A.util.store("letter", JSON.stringify(keep));
  }

  // Translated labels from templatesI18n (uk, ar, tr, ru, fa), else the label on the field (de, en)
  function labelFor(f, lang, tplId) {
    const L = A.templatesI18n && A.templatesI18n[lang];
    if (L) {
      const own = tplId ? L.tpl[tplId] && L.tpl[tplId].fields[f.id] : L.common[f.id];
      if (own) return own;
    }
    return f[lang] || f.en || f.de;
  }

  function inputHtml(f, lang, esc, tplId) {
    const label = labelFor(f, lang, tplId);
    const id = "f-" + f.id;
    const val = values[f.id] ?? "";
    if (f.type === "check") {
      return `<label class="choice" style="grid-column:1/-1"><input type="checkbox" id="${id}" data-id="${f.id}"${val === true ? " checked" : ""}><span>${esc(label)}</span></label>`;
    }
    const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : "";
    let control;
    if (f.type === "textarea") control = `<textarea id="${id}" data-id="${f.id}" rows="${f.rows || 3}"${ph}>${esc(val)}</textarea>`;
    else if (f.type === "date") control = `<input type="date" id="${id}" data-id="${f.id}" value="${esc(val)}">`;
    else control = `<input type="text" id="${id}" data-id="${f.id}" value="${esc(val)}"${ph}${f.type === "money" ? ' inputmode="decimal"' : ""}>`;
    const wide = f.type === "textarea" ? ' style="grid-column:1/-1"' : "";
    return `<div class="field"${wide}><label for="${id}">${esc(label)}</label>${control}</div>`;
  }

  function render(el) {
    const { esc, h, t, state, todayISO, copyText } = A.util;
    const lang = state.lang;
    load();
    if (state.shared.template) {
      current = state.shared.template;
      state.shared.template = null;
    }
    // Take over the letter date from the deadline calculator, if available
    if (state.shared.letterDate && !values.letterDate) values.letterDate = state.shared.letterDate;

    const tpl = TEMPLATES.find((x) => x.id === current) || TEMPLATES[0];
    const L = A.templatesI18n && A.templatesI18n[lang];
    const tx = (x) => x[lang] || (L && L.tpl[x.id]) || x.en || x.de;
    const inFrame = window.self !== window.top;

    el.replaceChildren(
      h(`
      <section class="view" aria-labelledby="v-title">
        <header style="display:grid;gap:10px">
          <p class="eyebrow">${esc(t("v.eyebrow"))}</p>
          <h2 id="v-title">${esc(t("v.title"))}</h2>
          <p class="lede">${esc(t("v.lede"))}</p>
        </header>
        <div class="tpl-list" role="group" aria-label="${esc(t("v.choose"))}">
          ${TEMPLATES.map((x) => `<button type="button" class="tpl-card" data-id="${x.id}" aria-pressed="${x.id === tpl.id}"><strong>${esc(tx(x).title)}</strong><span class="small">${esc(tx(x).desc)}</span></button>`).join("")}
        </div>
        <form class="sheet" id="v-form" novalidate>
          <h3>${esc(t("v.you"))}</h3>
          <div class="row-2">${COMMON.map((f) => inputHtml(f, lang, esc)).join("")}</div>
          <h3>${esc(tx(tpl).title)}</h3>
          <div class="row-2">${tpl.fields.map((f) => inputHtml(f, lang, esc, tpl.id)).join("")}</div>
          <p class="small">${esc(t("v.privacy"))}</p>
        </form>
        <section class="sheet" aria-labelledby="v-letter-title">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
            <h3 id="v-letter-title">${esc(t("v.letter"))}</h3>
            <div class="btn-row no-print">
              <button type="button" class="btn" id="v-copy">${esc(t("v.copy"))}</button>
              ${inFrame ? "" : `<button type="button" class="btn secondary" id="v-print">${esc(t("v.print"))}</button><button type="button" class="btn secondary" id="v-download">${esc(t("v.download"))}</button>`}
            </div>
          </div>
          <pre class="letter" id="v-letter" lang="de"></pre>
          <p class="small" id="v-missing"></p>
          <div class="callout"><strong>${esc(t("v.notes"))}</strong>
            <ul style="margin:6px 0 0;padding-inline-start:1.2em;display:grid;gap:4px">${(tpl.notes[lang] || (L && L.tpl[tpl.id] && L.tpl[tpl.id].notes) || tpl.notes.en || tpl.notes.de).map((n) => `<li>${esc(n)}</li>`).join("")}</ul>
          </div>
        </section>
      </section>`)
    );

    const letterEl = el.querySelector("#v-letter");
    const missingEl = el.querySelector("#v-missing");
    const draw = () => {
      const text = buildLetter(tpl, values, todayISO());
      letterEl.textContent = text;
      const missing = (text.match(/\[[^\]]+\]/g) || []).length;
      missingEl.textContent = missing ? t("v.missing", { n: missing }) : t("v.complete");
    };

    const form = el.querySelector("#v-form");
    form.addEventListener("input", (e) => {
      const id = e.target.dataset.id;
      if (!id) return;
      values[id] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
      save();
      draw();
    });
    form.addEventListener("change", (e) => {
      const id = e.target.dataset.id;
      if (id && e.target.type === "checkbox") {
        values[id] = e.target.checked;
        draw();
      }
    });
    form.addEventListener("submit", (e) => e.preventDefault());

    el.querySelectorAll(".tpl-card").forEach((b) =>
      b.addEventListener("click", () => {
        current = b.dataset.id;
        render(el);
        el.querySelector("#v-form").scrollIntoView({ behavior: "smooth", block: "start" });
      })
    );

    el.querySelector("#v-copy").addEventListener("click", async (e) => {
      const ok = await copyText(letterEl.textContent, e.currentTarget, t("frist.copied"));
      if (!ok) {
        const range = document.createRange();
        range.selectNodeContents(letterEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    });
    const printBtn = el.querySelector("#v-print");
    if (printBtn) printBtn.addEventListener("click", () => window.print());
    const dlBtn = el.querySelector("#v-download");
    if (dlBtn)
      dlBtn.addEventListener("click", () => {
        const blob = new Blob([letterEl.textContent], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${tpl.id}.txt`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 500);
      });
    draw();
  }

  A.views.vorlagen = { render };
})();

</script>

        "Erwerbslosen- und Sozialhilfeberatung": ["مشاوره برای بیکاران و دریافت‌کنندگان کمک اجتماعی", "مشاوره مستقل درباره جاب‌سنتر و اداره امور اجتماعی. Tacheles e. V. یک انجمن بزرگ و فهرست مراکز مشاوره دارد."],
        "Schuldnerberatung": ["مشاوره بدهی", "مشاوره بدهی رایگان و معتبر از طریق مؤسسات خیریه و مراکز حمایت از مصرف‌کننده. مراقب شرکت‌هایی باشید که برای „کمک به بدهی“ پول می‌گیرند."],
        "Verbraucherzentrale": ["مرکز حمایت از مصرف‌کننده", "کمک در قراردادها، صورت‌حساب‌ها، شرکت‌های وصول، انرژی و بیمه. برخی خدمات هزینه کمی دارند."],
        "Mieterverein": ["انجمن مستأجران", "مشاوره درباره اجاره، هزینه‌های جانبی و فسخ قرارداد. عضویت لازم است (معمولاً چند یورو در ماه)."],
        "PRO ASYL und Flüchtlingsräte": ["PRO ASYL و شوراهای پناهندگان", "مشاوره و اطلاعات درباره پناهندگی، Duldung و اقامت. PRO ASYL مراکز مشاوره در ایالت شما را معرفی می‌کند."],
        "Handbook Germany": ["Handbook Germany", "اطلاعات درباره زندگی در آلمان به زبان‌های بسیار، با جستجوی مراکز مشاوره نزدیک شما."],
      },
      brief: [
        ["فرستنده", "کدام اداره نوشته است؟ جوابتان را هم به همان‌جا می‌فرستید."],
        ["تاریخ تصمیم", "برای مهلت مهم است. در پست معمولی نامه ۴ روز بعد تحویل‌شده حساب می‌شود. این تاریخ را در محاسبه‌گر مهلت وارد کنید."],
        ["شماره پرونده", "شماره پرونده شما. آن را روی هر نامه به اداره بنویسید."],
        ["موضوع: این چه نامه‌ای است؟", "„Aufhebung“ یعنی تأیید قبلی لغو شده است. „Erstattung“ یعنی از شما خواسته شده پول را پس بدهید."],
        ["تصمیم", "اصل مطلب این است: اداره چه تصمیمی گرفته و برای چه دوره‌ای؟ اول این بخش را بخوانید."],
        ["مبلغ و مهلت پرداخت", "چقدر، تا کی، به کدام حساب. حتی اگر اعتراض کنید، اغلب باز هم باید بپردازید – اما می‌توانید قسط یا مهلت بخواهید."],
        ["دلایل", "چرا اداره این تصمیم را گرفته؟ ارقام و تاریخ‌ها را بررسی کنید. همه چیز درست است؟ اشتباه در اینجا دلیل خوبی برای اعتراض است."],
        ["راهنمای اعتراض", "اینجا نوشته که چطور اعتراض کنید: اعتراض، مهلت (معمولاً ۱ ماه)، آدرس. اگر این بخش نباشد، معمولاً ۱ سال وقت دارید."],
        ["امضا ندارد؟", "عادی است. تصمیم‌هایی که با ماشین ساخته شده‌اند بدون امضا هم معتبرند."],
      ],
    },
  };
})(typeof self !== "undefined" ? self : this);

</script>
<script>
/* Amtsklar – free help view */
(function () {
  "use strict";
  const A = (window.Amtsklar = window.Amtsklar || {});
  A.views = A.views || {};
  const { HELP, GROUPS } = A.help;

  function render(el) {
    const { esc, h, t, state } = A.util;
    const lang = state.lang;
    const tx = (o) => o[lang] || o.en || o.de;
    const X = A.extraI18n && A.extraI18n[lang];
    const groupName = (g) => (X && X.groups[g]) || tx(GROUPS[g]);
    const itemText = (x, i) => (X && X.help[x.name.de] ? X.help[x.name.de][i] : tx(i === 0 ? x.name : x.what));
    el.replaceChildren(
      h(`
      <section class="view" aria-labelledby="h-title">
        <header style="display:grid;gap:10px">
          <p class="eyebrow">${esc(t("h.eyebrow"))}</p>
          <h2 id="h-title">${esc(t("h.title"))}</h2>
          <p class="lede">${esc(t("h.lede"))}</p>
        </header>
        <p class="callout warn"><strong>${esc(t("h.emergency"))}</strong></p>
        ${Object.keys(GROUPS)
          .map(
            (g) => `
          <section class="sheet" aria-labelledby="h-${g}">
            <h3 id="h-${g}">${esc(groupName(g))}</h3>
            <div class="help-list">
              ${HELP.filter((x) => x.group === g)
                .map(
                  (x) => `
                <article class="help-item">
                  <h3>${esc(itemText(x, 0))}</h3>
                  <p>${esc(itemText(x, 1))}</p>
                  ${x.phone ? `<p>${esc(t("h.phone"))}: <span class="phone">${esc(x.phone)}</span></p>` : ""}
                  ${x.url ? `<p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url.replace(/^https:\/\/(www\.)?/, ""))}</a></p>` : ""}
                </article>`
                )
                .join("")}
            </div>
          </section>`
          )
          .join("")}
        <section class="sheet">
          <h3>${esc(t("h.bring"))}</h3>
          <ul style="margin:0;padding-inline-start:1.2em;display:grid;gap:6px">
            <li>${esc(t("h.bring.1"))}</li><li>${esc(t("h.bring.2"))}</li><li>${esc(t("h.bring.3"))}</li><li>${esc(t("h.bring.4"))}</li>
          </ul>
        </section>
      </section>`)
    );
  }
  A.views.hilfe = { render };
})();

</script>
<script>
/*
 * Amtsklar – app shell: routing, language, deadline calculator view.
 * Other views register themselves on Amtsklar.views before this file runs
 * or after (rendering happens on DOMContentLoaded).
 */
(function () {
  "use strict";
  const A = (window.Amtsklar = window.Amtsklar || {});
  A.views = A.views || {};
  const { LANGS, t: tr } = A.i18n;
  const D = A.deadline;

  const ROUTES = ["frist", "brief", "ratgeber", "woerter", "vorlagen", "hilfe"];
  const state = {
    lang: "de",
    route: "frist",
    shared: {}, // data passed between views, e.g. deadline -> template
  };

  // ---------------------------------------------------------------- helpers
  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem("amtsklar." + key);
      localStorage.setItem("amtsklar." + key, value);
    } catch (e) {
      return null;
    }
    return null;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  function t(key, vars) {
    return tr(state.lang, key, vars);
  }

  function fmtDate(iso) {
    const [y, m, d] = iso.split("-");
    return `${d}.${m}.${y}`;
  }

  function todayISO() {
    const now = new Date();
    const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0, 10);
  }

  function h(html) {
    const tpl = document.createElement("template");
    tpl.innerHTML = html.trim();
    return tpl.content;
  }

  async function copyText(text, button, doneLabel) {
    try {
      await navigator.clipboard.writeText(text);
      if (button) {
        const old = button.textContent;
        button.textContent = doneLabel || "✓";
        setTimeout(() => (button.textContent = old), 1600);
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  A.util = { esc, fmtDate, todayISO, h, copyText, store, t: (k, v) => t(k, v), state };

  // ---------------------------------------------------------------- deadline view
  const fristForm = {
    delivery: "post",
    date: "",
    period: "1m",
    state: "BY",
  };

  function renderFrist(el) {
    if (state.shared.period) {
      fristForm.period = state.shared.period;
      state.shared.period = null;
    }
    const savedState = store("state");
    if (savedState && D.STATES[savedState]) fristForm.state = savedState;
    if (!fristForm.date) {
      // Example: a letter dated ten days ago, so the first view shows a real result
      const d = new Date();
      d.setDate(d.getDate() - 10);
      fristForm.date = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    const stateOptions = Object.entries(D.STATES)
      .map(([code, name]) => `<option value="${code}"${code === fristForm.state ? " selected" : ""}>${esc(name)}</option>`)
      .join("");
    const periodOptions = ["1w", "2w", "1m", "3m", "1y"]
      .map((p) => `<option value="${p}"${p === fristForm.period ? " selected" : ""}>${esc(t("frist.period." + p))}</option>`)
      .join("");
    const how = ["post", "formal", "known"]
      .map(
        (k) => `
        <label class="choice">
          <input type="radio" name="delivery" id="delivery-${k}" value="${k}"${fristForm.delivery === k ? " checked" : ""}>
          <span>${esc(t("frist.how." + k))}</span>
          <span class="hint">${esc(t("frist.how." + k + ".hint"))}</span>
        </label>`
      )
      .join("");

    el.replaceChildren(
      h(`
      <section class="view" aria-labelledby="frist-title">
        <header style="display:grid;gap:10px">
          <p class="eyebrow">${esc(t("frist.eyebrow"))}</p>
          <h2 id="frist-title">${esc(t("frist.title"))}</h2>
          <p class="lede">${esc(t("frist.lede"))}</p>
        </header>
        <form class="sheet" id="frist-form" novalidate>
          <fieldset class="field" style="border:0;padding:0;margin:0">
            <legend class="label" style="font-weight:700;margin-bottom:6px">${esc(t("frist.how"))}</legend>
            <div class="choices">${how}</div>
          </fieldset>
          <div class="row-2">
            <div class="field">
              <label for="frist-date" id="frist-date-label"></label>
              <input type="date" id="frist-date" value="${esc(fristForm.date)}" required>
              <span class="hint" id="frist-date-hint"></span>
            </div>
            <div class="field">
              <label for="frist-period">${esc(t("frist.period"))}</label>
              <select id="frist-period">${periodOptions}</select>
              <span class="hint">${esc(t("frist.period.hint"))}</span>
            </div>
          </div>
          <div class="field">
            <label for="frist-state">${esc(t("frist.state"))}</label>
            <select id="frist-state">${stateOptions}</select>
            <span class="hint">${esc(t("frist.state.hint"))}</span>
          </div>
        </form>
        <section class="sheet result" id="frist-result" aria-live="polite"></section>
        <section class="sheet">
          <h3>${esc(t("frist.tips"))}</h3>
          <ul style="margin:0;padding-inline-start:1.2em;display:grid;gap:8px">
            <li>${esc(t("frist.tip.1"))}</li>
            <li>${esc(t("frist.tip.2"))}</li>
            <li>${esc(t("frist.tip.3"))}</li>
            <li>${esc(t("frist.tip.4"))}</li>
          </ul>
        </section>
      </section>`)
    );

    const form = el.querySelector("#frist-form");
    const update = (animate) => {
      fristForm.delivery = form.querySelector('input[name="delivery"]:checked').value;
      fristForm.date = form.querySelector("#frist-date").value;
      fristForm.period = form.querySelector("#frist-period").value;
      fristForm.state = form.querySelector("#frist-state").value;
      store("state", fristForm.state);
      form.querySelector("#frist-date-label").textContent = t("frist.date." + fristForm.delivery);
      form.querySelector("#frist-date-hint").textContent = t("frist.date." + fristForm.delivery + ".hint");
      renderFristResult(el.querySelector("#frist-result"), animate);
    };
    form.addEventListener("input", () => update(true));
    form.addEventListener("change", () => update(true));
    form.addEventListener("submit", (e) => e.preventDefault());
    update(false);
  }

  function renderFristResult(box, animate) {
    let r;
    try {
      r = D.compute({ ...fristForm, today: todayISO() });
    } catch (e) {
      box.replaceChildren(h(`<p class="callout warn">${esc(t("frist.invalid"))}</p>`));
      return;
    }
    state.shared.deadline = r;
    if (fristForm.delivery === "post") state.shared.letterDate = fristForm.date;

    const stepText = (s) => {
      if (s.key === "fiction") return { text: t("frist.step.fiction", { from: fmtDate(s.from), days: s.days, to: fmtDate(s.to) }), law: t("frist.law.fiction") };
      if (s.key === "formal" || s.key === "known") return { text: t("frist.step." + s.key, { to: fmtDate(s.to) }), law: "" };
      if (s.key === "period")
        return { text: t("frist.step.period", { period: t("period." + s.period), from: fmtDate(s.from), to: fmtDate(s.to) }), law: t("frist.law.period") };
      if (s.key === "monthEnd") return { text: t("frist.step.monthEnd", { to: fmtDate(s.to) }), law: t("frist.law.monthEnd") };
      if (s.key === "shift") {
        const list = s.skipped
          .map((x) => `${fmtDate(x.date)}: ${x.reason.type === "holiday" ? x.reason.name : t("weekday." + D.parseISO(x.date).getUTCDay())}`)
          .join(", ");
        return { text: t("frist.step.shift", { list, to: fmtDate(s.to) }), law: t("frist.law.shift") };
      }
      return { text: "", law: "" };
    };

    let countdown = "";
    let cls = "countdown";
    if (r.daysLeft !== null) {
      if (r.daysLeft < 0) {
        countdown = t("frist.daysLeft.past", { n: -r.daysLeft });
        cls += " past";
      } else if (r.daysLeft === 0) {
        countdown = t("frist.daysLeft.0");
        cls += " urgent";
      } else if (r.daysLeft === 1) {
        countdown = t("frist.daysLeft.1");
        cls += " urgent";
      } else {
        countdown = t("frist.daysLeft", { n: r.daysLeft });
        if (r.daysLeft <= 7) cls += " urgent";
      }
    }

    const warnings = r.warnings
      .map((w) =>
        w.key === "partialHoliday"
          ? `<p class="callout">${esc(t("frist.warn.partial", { date: fmtDate(w.date), name: w.name }))}</p>`
          : `<p class="small">${esc(t("frist.warn.received"))}</p>`
      )
      .join("");

    const deadlineText = `${t("weekday." + r.weekday)}, ${fmtDate(r.deadline)}`;
    box.replaceChildren(
      h(`
      <div class="stamp-wrap">
        <div class="stamp${animate ? " fresh" : ""}" role="img" aria-label="${esc(t("frist.result.label") + " " + deadlineText)}">
          <span class="stamp-label">${esc(t("frist.result.label"))}</span>
          <span class="stamp-date">${esc(fmtDate(r.deadline))}</span>
          <span class="stamp-day">${esc(t("weekday." + r.weekday))}</span>
        </div>
      </div>
      ${countdown ? `<p class="${cls}">${esc(countdown)}</p>` : ""}
      <p>${t("frist.result.end", { date: `<span class="mark">${esc(deadlineText)}</span>` })}</p>
      ${r.daysLeft !== null && r.daysLeft < 0 ? `<p class="callout warn">${esc(t("frist.past.help"))}</p>` : ""}
      <div style="display:grid;gap:4px">
        <h3>${esc(t("frist.steps"))}</h3>
        <ol class="steps">
          ${r.steps
            .map((s) => {
              const x = stepText(s);
              return `<li><div><p>${esc(x.text)}</p>${x.law ? `<p class="law">${esc(x.law)}</p>` : ""}</div></li>`;
            })
            .join("")}
        </ol>
      </div>
      ${warnings}
      <div class="btn-row no-print">
        <a class="btn" href="#vorlagen" id="to-template" style="text-decoration:none">${esc(t("frist.toTemplate"))}</a>
        <button class="btn secondary" type="button" id="copy-result">${esc(t("frist.copy"))}</button>
        ${window.self === window.top ? `<button class="btn secondary" type="button" id="cal-result">${esc(t("frist.calendar"))}</button>` : ""}
      </div>
    `)
    );
    const calBtn = box.querySelector("#cal-result");
    if (calBtn)
      calBtn.addEventListener("click", () => {
        const desc = [deadlineText, ...r.steps.map((s) => "- " + stepText(s).text), "", t("frist.tip.1")].join("\n");
        const ics = D.toICS(r.deadline, t("frist.cal.summary"), desc);
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar;charset=utf-8" }));
        a.download = `frist-${r.deadline}.ics`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 500);
      });
    box.querySelector("#copy-result").addEventListener("click", (e) => {
      const lines = [
        `${t("frist.result.label")}: ${deadlineText}`,
        ...r.steps.map((s) => "- " + stepText(s).text),
        "",
        "Amtsklar – " + t("disclaimer"),
      ];
      copyText(lines.join("\n"), e.currentTarget, t("frist.copied"));
    });
  }

  A.views.frist = { render: renderFrist };

  // ---------------------------------------------------------------- shell
  function renderShell() {
    const lang = LANGS[state.lang];
    document.documentElement.lang = state.lang;
    document.documentElement.dir = lang.dir;

    document.querySelector("#tagline").textContent = t("tagline");
    document.querySelector("#lang-label").textContent = t("language");
    const select = document.querySelector("#lang");
    select.replaceChildren(
      ...Object.entries(LANGS).map(([code, l]) => {
        const o = document.createElement("option");
        o.value = code;
        o.textContent = l.name;
        o.selected = code === state.lang;
        return o;
      })
    );
    const nav = document.querySelector("#tabs");
    nav.replaceChildren(
      ...ROUTES.filter((r) => A.views[r]).map((r) => {
        const a = document.createElement("a");
        a.className = "tab";
        a.href = "#" + r;
        a.textContent = t("nav." + r);
        if (r === state.route) a.setAttribute("aria-current", "page");
        return a;
      })
    );
    const note = document.querySelector("#lang-note");
    note.hidden = !lang.ai;
    note.textContent = lang.ai ? t("lang.ai") : "";
    document.querySelector("#disclaimer").textContent = t("disclaimer");
    document.querySelector("#privacy").textContent = t("footer.privacy");
    document.querySelector("#source-label").textContent = t("footer.source");
    document.querySelector("#updated").textContent = t("footer.updated");
  }

  function render() {
    renderShell();
    const view = A.views[state.route] || A.views.frist;
    view.render(document.querySelector("#view"), { t, state });
  }

  function routeFromHash() {
    const name = location.hash.replace(/^#/, "");
    return ROUTES.includes(name) && A.views[name] ? name : "frist";
  }

  function init() {
    const saved = store("lang");
    const browser = (navigator.language || "de").slice(0, 2);
    state.lang = LANGS[saved] ? saved : LANGS[browser] ? browser : "de";
    state.route = routeFromHash();
    document.querySelector("#lang").addEventListener("change", (e) => {
      state.lang = e.target.value;
      store("lang", state.lang);
      render();
    });
    window.addEventListener("hashchange", () => {
      state.route = routeFromHash();
      render();
      window.scrollTo(0, 0);
    });
    render();
  }

  // Offline support when served over HTTPS (e.g. GitHub Pages), not inside embeds
  if ("serviceWorker" in navigator && location.protocol === "https:" && window.self === window.top) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }

  A.rerender = render;
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
