name: Amtsklar

on:
  push:
    paths: ["amtsklar/**", ".github/workflows/amtsklar.yml"]
  pull_request:
    paths: ["amtsklar/**", ".github/workflows/amtsklar.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        working-directory: amtsklar
        run: node --test tests/*.test.js
      - name: Build single-file version
        working-directory: amtsklar
        run: node tools/build.js
      - name: Check that dist/ is up to date
        run: git diff --exit-code -- amtsklar/dist || (echo "Run 'node tools/build.js' and commit amtsklar/dist" && exit 1)

  deploy:
    # Publishes the app to GitHub Pages from the default branch.
    # One-time setup: Settings -> Pages -> Source: "GitHub Actions".
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: amtsklar
      - id: deployment
        uses: actions/deploy-pages@v4
